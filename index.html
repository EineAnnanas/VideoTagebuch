<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Videotagebuch</title>

<!--
  ============================================================
   VIDEOTAGEBUCH – Wochenansicht
  ============================================================

   Eine einzige Datei, kein Build, kein npm. Läuft auf GitHub Pages.

   Aufbau: sieben Tagesspalten nebeneinander, darin pro Person
   ein Platz. Belegt = Vorschaubild, anklickbar. Frei = gestrichelter
   Rahmen. Damit sieht man auf einen Blick, wer wann gefehlt hat.

   Anmeldung mit dem eigenen Projekt-Konto, danach spricht der
   Browser direkt mit Drive. Die Seite speichert nichts.

   Einrichtung: siehe README.md
  ============================================================
-->

<style>
  :root {
    --rand: #ddd;
    --grau: #666;
    --hell: #f7f7f7;
  }
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, sans-serif;
    margin: 0 auto;
    padding: 1rem;
    max-width: 1100px;
    line-height: 1.5;
  }

  header {
    display: flex;
    align-items: baseline;
    gap: 1rem;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--rand);
    padding-bottom: .75rem;
    margin-bottom: 1rem;
  }
  h1 { font-size: 1.25rem; margin: 0; }

  button, select {
    font: inherit;
    padding: .4rem .8rem;
    border: 1px solid var(--rand);
    background: #fff;
    cursor: pointer;
    border-radius: 4px;
  }
  button:hover:not(:disabled) { background: var(--hell); }
  button:disabled { opacity: .5; cursor: default; }

  /* ---- Hochladen ---- */
  #hochladen-bereich {
    border: 1px solid var(--rand);
    border-radius: 4px;
    padding: .75rem;
    margin-bottom: 1.25rem;
    display: flex;
    align-items: center;
    gap: .75rem;
    flex-wrap: wrap;
  }
  #hochladen-bereich label { font-size: .85rem; color: var(--grau); }
  #balken { flex-basis: 100%; height: 6px; background: #eee; border-radius: 3px; overflow: hidden; }
  #balken > div { height: 100%; width: 0; background: #333; transition: width .2s; }

  /* ---- Wochenleiste ---- */
  #wochenleiste {
    display: flex;
    align-items: center;
    gap: .5rem;
    margin-bottom: .75rem;
  }
  #wochentitel { font-weight: 600; margin: 0 .5rem; }
  #dran { margin-left: auto; color: var(--grau); font-size: .85rem; }
  #wochenleiste .pfeil { padding: .3rem .7rem; }

  /* ---- Wochenraster ---- */
  #woche {
    display: grid;
    grid-template-columns: repeat(7, minmax(130px, 1fr));
    gap: .5rem;
    overflow-x: auto;
    padding-bottom: .5rem;
  }

  .tagspalte { min-width: 130px; }
  .tagkopf {
    border-bottom: 2px solid var(--rand);
    padding-bottom: .3rem;
    margin-bottom: .5rem;
    font-size: .85rem;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .tagkopf .wochentag { font-weight: 600; }
  .tagkopf .datum { color: var(--grau); }
  .tagspalte.heute .tagkopf { border-bottom-color: #333; }
  .tagspalte.zukunft { opacity: .45; }

  .slot {
    border: 1px solid var(--rand);
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: .5rem;
    background: #fff;
  }
  .slot.leer {
    border-style: dashed;
    background: var(--hell);
  }
  .slot .bild {
    aspect-ratio: 3 / 4;
    background: #eee;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    cursor: pointer;
    font-size: .7rem;
    color: var(--grau);
    text-align: center;
    padding: .25rem;
  }
  .slot.leer .bild {
    background: transparent;
    cursor: default;
    aspect-ratio: 3 / 4;
  }
  .slot .bild img { width: 100%; height: 100%; object-fit: cover; }
  .slot .bild .play {
    position: absolute;
    font-size: 1.4rem;
    color: #fff;
    text-shadow: 0 0 8px rgba(0,0,0,.8);
    pointer-events: none;
  }
  .slot .anzahl {
    position: absolute;
    right: 4px;
    bottom: 4px;
    background: rgba(0,0,0,.7);
    color: #fff;
    font-size: .65rem;
    padding: 1px 5px;
    border-radius: 3px;
    pointer-events: none;
  }
  .slot .name {
    font-size: .72rem;
    padding: .3rem .4rem;
    border-top: 1px solid var(--rand);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .slot.leer .name { border-top: 0; color: var(--grau); }

  .slot.pause { border-style: dotted; background: var(--hell); }
  .slot.pause .bild { background: transparent; cursor: default; color: var(--grau); }
  .slot.pause .name { border-top: 0; color: var(--grau); }

  .slot.zusatz { opacity: .7; }
  .slot.zusatz .name::before { content: 'außer der Reihe: '; color: var(--grau); }

  /* ---- Overlay ---- */
  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.85);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
    z-index: 10;
  }
  #overlay-inhalt {
    background: #fff;
    border-radius: 4px;
    max-width: 700px;
    width: 100%;
    max-height: 100%;
    overflow: auto;
  }
  #overlay video, #overlay img.voll { width: 100%; display: block; background: #000; }
  #overlay .leiste {
    padding: .6rem .8rem;
    display: flex;
    gap: .5rem;
    align-items: center;
    flex-wrap: wrap;
    font-size: .85rem;
  }
  #overlay .leiste .info { color: var(--grau); margin-right: auto; }
  #overlay .ladeanzeige {
    padding: 3rem 1rem;
    text-align: center;
    color: var(--grau);
  }
  #overlay .ersatz { padding: 1.5rem; text-align: center; font-size: .9rem; }
  #overlay .ersatz p { color: var(--grau); }

  /* ---- Zusammenstellen vor dem Hochladen ---- */
  #composer {
    border: 1px solid #333;
    border-radius: 4px;
    padding: .75rem;
    margin-bottom: 1.25rem;
  }
  #composer .kopf { margin-bottom: .6rem; }
  #composer .hinweis {
    display: block;
    font-size: .8rem;
    color: var(--grau);
  }
  #composer-liste {
    list-style: none;
    margin: 0 0 .75rem;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: .4rem;
  }
  .eintrag {
    display: flex;
    align-items: center;
    gap: .6rem;
    border: 1px solid var(--rand);
    border-radius: 4px;
    padding: .4rem;
    background: #fff;
  }
  .eintrag .nr {
    font-size: .8rem;
    color: var(--grau);
    width: 1.2rem;
    text-align: center;
    flex: 0 0 auto;
  }
  .eintrag .mini {
    width: 54px;
    height: 54px;
    flex: 0 0 54px;
    background: #eee;
    border-radius: 3px;
    overflow: hidden;
  }
  .eintrag .mini img, .eintrag .mini video {
    width: 100%; height: 100%; object-fit: cover; display: block;
  }
  .eintrag .beschriftung {
    flex: 1 1 auto;
    min-width: 0;
    font-size: .8rem;
  }
  .eintrag .beschriftung .dateiname {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .eintrag .beschriftung .klein { color: var(--grau); font-size: .75rem; }
  .eintrag .knoepfe { display: flex; gap: .25rem; flex: 0 0 auto; }
  .eintrag .knoepfe button {
    padding: .3rem .5rem;
    min-width: 2rem;
    line-height: 1;
  }
  .composer-aktionen { display: flex; gap: .5rem; flex-wrap: wrap; }
  #absenden { border-color: #333; font-weight: 600; }

  /* ---- Listenansicht (schmale Bildschirme) ----
     Ein Tag pro Zeile, heute oben, nach unten in die Vergangenheit. */
  #liste { display: flex; flex-direction: column; gap: .5rem; }

  .zeile {
    display: flex;
    gap: .75rem;
    align-items: stretch;
    border: 1px solid var(--rand);
    border-radius: 4px;
    overflow: hidden;
    background: #fff;
  }
  .zeile.heute { border-color: #333; }
  .zeile.pause { border-style: dotted; background: var(--hell); }
  .zeile.fehlt { border-style: dashed; background: var(--hell); }

  .zeile .miniatur {
    width: 84px;
    flex: 0 0 84px;
    background: #eee;
    position: relative;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: .7rem;
    color: var(--grau);
    text-align: center;
  }
  .zeile.pause .miniatur, .zeile.fehlt .miniatur {
    background: transparent;
    cursor: default;
  }
  .zeile .miniatur img { width: 100%; height: 100%; object-fit: cover; }
  .zeile .miniatur .play {
    position: absolute;
    font-size: 1.3rem;
    color: #fff;
    text-shadow: 0 0 8px rgba(0,0,0,.8);
    pointer-events: none;
  }
  .zeile .text {
    padding: .6rem .7rem;
    min-height: 84px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: .1rem;
  }
  .zeile .datum { font-size: .78rem; color: var(--grau); }
  .zeile .wer { font-weight: 600; }
  .zeile .rest { font-size: .75rem; color: var(--grau); }
  .zeile .rest.bald { color: #b00; }

  /* ---- Handy-Vorschau ----
     Verengt die Seite auf typische Handybreite (390 px). Weil das
     Layout ohnehin mit der verfügbaren Breite arbeitet, sieht man
     dadurch am Laptop dasselbe wie auf dem Telefon. */
  body.handy {
    max-width: 390px;
    border: 1px solid #333;
    border-radius: 22px;
    padding: 1rem .75rem;
    margin: 1.5rem auto;
  }
  body.handy header { gap: .5rem; }
  body.handy h1 { font-size: 1.1rem; }
  body.handy #hochladen-bereich { padding: .5rem; gap: .5rem; }
  body.handy #dran { margin-left: 0; flex-basis: 100%; }
  body.handy #wochenleiste { flex-wrap: wrap; }

  #status { color: var(--grau); }
  #fehler {
    color: #b00;
    white-space: pre-wrap;
    font-size: .85rem;
    border: 1px solid #b00;
    padding: .75rem;
    border-radius: 4px;
    margin-bottom: 1rem;
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<header>
  <h1>Videotagebuch</h1>
  <button id="anmelden">Mit Google anmelden</button>
  <button id="neuladen" hidden>Neu laden</button>
  <button id="handyknopf" title="Layout in Handybreite ansehen">Handy-Ansicht</button>
</header>

<div id="hochladen-bereich" hidden>
  <label for="person">Ich bin</label>
  <select id="person"></select>
  <label for="fuer">für</label>
  <select id="fuer">
    <option value="0">heute</option>
    <option value="1">gestern</option>
    <option value="2">vorgestern</option>
  </select>
  <button id="waehlen">Videos auswählen</button>
  <input type="file" id="datei" accept="video/*,image/*" multiple hidden>
  <span id="hochladen-status"></span>
  <div id="balken" hidden><div></div></div>
</div>

<section id="composer" hidden>
  <div class="kopf">
    <strong id="composer-titel"></strong>
    <span class="hinweis">Reihenfolge festlegen, ansehen, dann abschicken.</span>
  </div>
  <ol id="composer-liste"></ol>
  <div class="composer-aktionen">
    <button id="vorschau">Vorschau ansehen</button>
    <button id="mehr">Weitere hinzufügen</button>
    <button id="absenden">Hochladen</button>
    <button id="verwerfen">Verwerfen</button>
  </div>
</section>

<div id="fehler" hidden></div>
<p id="status">Nicht angemeldet.</p>

<nav id="wochenleiste" hidden>
  <button class="pfeil" id="zurueck" title="Woche zurück">‹</button>
  <button class="pfeil" id="vor" title="Woche vor">›</button>
  <span id="wochentitel"></span>
  <button id="diesewoche">Diese Woche</button>
  <span id="dran"></span>
</nav>

<div id="woche" hidden></div>
<div id="liste" hidden></div>

<div id="overlay" hidden><div id="overlay-inhalt"></div></div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
// ============ EINSTELLUNGEN ============

const CONFIG = {

  CLIENT_ID: '162999381232-kmusrtl8hsnp8ilr8dg71pb7q9udobnm.apps.googleusercontent.com',

  // Der Hauptordner "Videotagebuch"
  ORDNER_ID: '1quX3ETKLsfNxEIsOpiOXHOgrcbtJnsBb',

  AUFBEWAHRUNG_TAGE: 30,

  // Wie lange ein Bild beim Abspielen stehen bleibt, bevor der
  // nächste Clip kommt.
  BILD_SEKUNDEN: 4,

  // Wer wann dran ist.
  //
  // Sieben Namen plus ein Pausentag ergeben einen Zyklus von acht
  // Tagen. Weil eine Woche nur sieben Tage hat, verschiebt sich die
  // Zuteilung jede Woche um einen Tag – sonst hätte jeder für immer
  // denselben Wochentag. Nach acht Wochen war jeder einmal überall.
  //
  // null steht für den Pausentag. Reihenfolge einfach umsortieren,
  // wenn ihr tauschen wollt.
  REIHENFOLGE: [
    'fabian', 'lennart', 'joshua', 'dario', 'benni', 'jarno', 'timo', null
  ],

  // Erster Tag des Zyklus – an diesem Tag ist der erste Name dran.
  ZYKLUS_START: '2026-08-10',

  // Vollzugriff auf Drive. Der eingeschränkte Bereich drive.file
  // dürfte nur Dateien anfassen, die die App selbst angelegt hat –
  // dann sähe niemand die Videos der anderen.
  BEREICH: 'https://www.googleapis.com/auth/drive'
};

const WOCHENTAGE = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];
const MONATE = ['Januar','Februar','März','April','Mai','Juni','Juli',
                'August','September','Oktober','November','Dezember'];


// ============ ZUSTAND ============

let token = null;
let tokenClient = null;
let unterordner = [];      // [{id, name}]
let dateien = [];          // alle Dateien mit .ordner und .tagSchluessel
let wochenStart = montagVon(new Date());

const el = {
  anmelden:  document.getElementById('anmelden'),
  neuladen:  document.getElementById('neuladen'),
  status:    document.getElementById('status'),
  fehler:    document.getElementById('fehler'),
  bereich:   document.getElementById('hochladen-bereich'),
  person:    document.getElementById('person'),
  fuer:      document.getElementById('fuer'),
  waehlen:   document.getElementById('waehlen'),
  datei:     document.getElementById('datei'),
  hlStatus:  document.getElementById('hochladen-status'),
  balken:    document.getElementById('balken'),
  composer:  document.getElementById('composer'),
  cTitel:    document.getElementById('composer-titel'),
  cListe:    document.getElementById('composer-liste'),
  leiste:    document.getElementById('wochenleiste'),
  titel:     document.getElementById('wochentitel'),
  dran:      document.getElementById('dran'),
  woche:     document.getElementById('woche'),
  liste:     document.getElementById('liste'),
  overlay:   document.getElementById('overlay'),
  overlayIn: document.getElementById('overlay-inhalt')
};


// ============ DATUM ============

/** Montag der Woche, in der d liegt. */
function montagVon(d) {
  const x = new Date(d);
  const versatz = (x.getDay() + 6) % 7;   // So=0 → 6
  x.setDate(x.getDate() - versatz);
  x.setHours(0, 0, 0, 0);
  return x;
}

/** 2026-08-10 – als Schlüssel zum Gruppieren, in lokaler Zeit. */
function schluessel(d) {
  const x = new Date(d);
  return x.getFullYear() + '-'
       + String(x.getMonth() + 1).padStart(2, '0') + '-'
       + String(x.getDate()).padStart(2, '0');
}

function plusTage(d, n) {
  const x = new Date(d);
  x.setDate(x.getDate() + n);
  return x;
}


// ============ WER IST DRAN ============

/**
 * Gibt den Namen zurück, der an diesem Tag dran ist –
 * oder null, wenn Pausentag.
 */
function werIstDran(tag) {
  const start = new Date(CONFIG.ZYKLUS_START + 'T00:00:00');
  const jetzt = new Date(tag);
  jetzt.setHours(0, 0, 0, 0);

  const laenge = CONFIG.REIHENFOLGE.length;
  const abstand = Math.round((jetzt - start) / 86400000);
  const index = ((abstand % laenge) + laenge) % laenge;

  return CONFIG.REIHENFOLGE[index];
}

/** Sucht den Drive-Unterordner, der zu einem Namen gehört. */
function ordnerFuer(name) {
  if (!name) return null;
  const gesucht = name.toLowerCase();
  return unterordner.find(function (o) {
    return o.name.toLowerCase().indexOf(gesucht) !== -1;
  }) || null;
}


/**
 * Zu welchem Tag gehört eine Datei?
 *
 * Normalerweise der Upload-Zeitpunkt. Wer aber etwas nachreicht,
 * lädt es mit einem vorangestellten Datum hoch – dann zählt das,
 * damit das Video am richtigen Tag erscheint und nicht am Tag des
 * Nachreichens. Für das Löschen bleibt der echte Upload-Zeitpunkt
 * maßgeblich; das entscheidet das Apps Script.
 */
function tagAus(datei) {
  const treffer = /^(\d{4}-\d{2}-\d{2})_/.exec(datei.name || '');
  return treffer ? treffer[1] : schluessel(datei.createdTime);
}


// ============ ANMELDUNG ============

window.onload = function () {
  if (CONFIG.CLIENT_ID.indexOf('apps.googleusercontent.com') === -1) {
    zeigeFehler('Es ist noch keine CLIENT_ID eingetragen. Siehe README.md.');
    el.anmelden.disabled = true;
    return;
  }

  const warten = setInterval(function () {
    if (!window.google || !google.accounts) return;
    clearInterval(warten);

    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: CONFIG.CLIENT_ID,
      scope: CONFIG.BEREICH,
      callback: function (antwort) {
        if (antwort.error) {
          zeigeFehler('Anmeldung fehlgeschlagen: ' + antwort.error);
          return;
        }
        token = antwort.access_token;
        el.anmelden.hidden = true;
        el.neuladen.hidden = false;
        el.bereich.hidden = false;
        laden();
      }
    });
  }, 100);
};

el.anmelden.onclick = function () { tokenClient.requestAccessToken(); };
el.neuladen.onclick = function () { laden(); };


// ============ HANDY-VORSCHAU ============

const handyKnopf = document.getElementById('handyknopf');

handyKnopf.onclick = function () {
  setzeHandy(!document.body.classList.contains('handy'));
};

function setzeHandy(an) {
  document.body.classList.toggle('handy', an);
  handyKnopf.textContent = an ? 'Volle Breite' : 'Handy-Ansicht';
  try { localStorage.setItem('videotagebuch.handy', an ? '1' : '0'); } catch (e) {}
  if (dateien.length || token) zeichne();
}

try {
  if (localStorage.getItem('videotagebuch.handy') === '1') setzeHandy(true);
} catch (e) {}


// ============ DRIVE LESEN ============

async function drive(pfad, params) {
  const url = new URL('https://www.googleapis.com/drive/v3/' + pfad);
  Object.keys(params || {}).forEach(function (k) {
    url.searchParams.set(k, params[k]);
  });

  const antwort = await fetch(url, { headers: { Authorization: 'Bearer ' + token } });

  if (antwort.status === 401) {
    token = null;
    tokenClient.requestAccessToken({ prompt: '' });
    throw new Error('Sitzung abgelaufen. Bitte noch einmal anmelden.');
  }
  if (!antwort.ok) {
    throw new Error('Drive antwortete mit ' + antwort.status + ':\n' + (await antwort.text()));
  }
  return antwort.json();
}

async function ordnerHolen() {
  const antwort = await drive('files', {
    q: "'" + CONFIG.ORDNER_ID + "' in parents"
       + " and mimeType='application/vnd.google-apps.folder' and trashed=false",
    fields: 'files(id,name)',
    orderBy: 'name',
    pageSize: 100
  });
  return antwort.files;
}

async function dateienHolen() {
  const quellen = [{ id: CONFIG.ORDNER_ID, name: '(Hauptordner)' }].concat(unterordner);
  const ergebnis = [];

  for (const ordner of quellen) {
    const inhalt = await drive('files', {
      q: "'" + ordner.id + "' in parents"
         + " and mimeType!='application/vnd.google-apps.folder' and trashed=false",
      fields: 'files(id,name,mimeType,createdTime,size,thumbnailLink)',
      orderBy: 'createdTime desc',
      pageSize: 200
    });
    inhalt.files.forEach(function (datei) {
      datei.ordner = ordner.name;
      datei.tagSchluessel = tagAus(datei);
      ergebnis.push(datei);
    });
  }
  return ergebnis;
}


// ============ LADEN ============

async function laden() {
  el.fehler.hidden = true;
  el.status.hidden = false;
  el.status.textContent = 'Lade …';

  try {
    unterordner = await ordnerHolen();
    fuellePersonen();
    dateien = await dateienHolen();

    el.status.hidden = true;
    zeichne();

  } catch (fehler) {
    el.status.hidden = true;
    zeigeFehler(fehler.message);
  }
}


// ============ WOCHENANSICHT ============

document.getElementById('zurueck').onclick = function () {
  wochenStart = plusTage(wochenStart, -7);
  zeichne();
};
document.getElementById('vor').onclick = function () {
  wochenStart = plusTage(wochenStart, 7);
  zeichne();
};
document.getElementById('diesewoche').onclick = function () {
  wochenStart = montagVon(new Date());
  zeichne();
};

/**
 * Schmale Bildschirme bekommen die Zeitleiste, breite das
 * Wochenraster. Sieben Spalten nebeneinander funktionieren auf
 * einem Telefon nicht.
 */
function istSchmal() {
  return document.body.classList.contains('handy')
      || window.innerWidth < 700;
}

function zeichne() {
  if (!dateien) return;

  if (istSchmal()) {
    el.leiste.hidden = true;
    el.woche.hidden = true;
    el.liste.hidden = false;
    zeichneListe();
  } else {
    el.leiste.hidden = false;
    el.woche.hidden = false;
    el.liste.hidden = true;
    zeichneWoche();
  }
}

// Beim Größenändern des Fensters umschalten, aber nicht bei jedem Pixel
let umschaltTimer = null;
window.addEventListener('resize', function () {
  clearTimeout(umschaltTimer);
  umschaltTimer = setTimeout(zeichne, 150);
});

function zeichneWoche() {
  const ende = plusTage(wochenStart, 6);
  el.titel.textContent = titelText(wochenStart, ende);
  zeigeWerDran();

  el.woche.innerHTML = '';
  const heuteSchluessel = schluessel(new Date());

  for (let i = 0; i < 7; i++) {
    const tag = plusTage(wochenStart, i);
    el.woche.appendChild(tagSpalte(tag, heuteSchluessel));
  }
}

/** Kleiner Hinweis über dem Raster: wer heute an der Reihe ist. */
function zeigeWerDran() {
  const dran = werIstDran(new Date());
  el.dran.textContent = dran === null
    ? 'Heute ist Pausentag.'
    : 'Heute ist ' + dran + ' dran.';
}

function titelText(von, bis) {
  if (von.getMonth() === bis.getMonth()) {
    return von.getDate() + '.–' + bis.getDate() + '. '
         + MONATE[von.getMonth()] + ' ' + von.getFullYear();
  }
  return von.getDate() + '. ' + MONATE[von.getMonth()] + ' – '
       + bis.getDate() + '. ' + MONATE[bis.getMonth()] + ' ' + bis.getFullYear();
}

function tagSpalte(tag, heuteSchluessel) {
  const s = schluessel(tag);
  const spalte = document.createElement('div');
  spalte.className = 'tagspalte';
  if (s === heuteSchluessel) spalte.classList.add('heute');
  if (tag.getTime() > Date.now()) spalte.classList.add('zukunft');

  const kopf = document.createElement('div');
  kopf.className = 'tagkopf';
  kopf.innerHTML =
      '<span class="wochentag">' + WOCHENTAGE[(tag.getDay() + 6) % 7] + '</span>'
    + '<span class="datum">' + tag.getDate() + '.' + (tag.getMonth() + 1) + '.</span>';
  spalte.appendChild(kopf);

  const dran = werIstDran(tag);

  if (dran === null) {
    spalte.appendChild(pausenSlot());
    return spalte;
  }

  // Videos dieses Tages aus dem Ordner der Person, die dran ist
  const ordner = ordnerFuer(dran);
  const treffer = ordner
    ? dateien.filter(function (d) {
        return d.tagSchluessel === s && d.ordner === ordner.name;
      })
    : [];

  treffer.sort(nachName);

  if (treffer.length) {
    // Alle Clips eines Tages bilden einen Platz und werden
    // nacheinander abgespielt.
    spalte.appendChild(vollerSlot(treffer[0], dran, false, treffer));
  } else {
    spalte.appendChild(leererSlot(dran, !ordner));
  }

  // Falls jemand außer der Reihe etwas hochgeladen hat, geht es
  // nicht verloren – es erscheint darunter als Zusatz.
  const zusatz = dateien.filter(function (d) {
    return d.tagSchluessel === s && (!ordner || d.ordner !== ordner.name);
  });
  zusatz.forEach(function (d) {
    spalte.appendChild(vollerSlot(d, d.ordner, true));
  });

  return spalte;
}

// ============ LISTENANSICHT ============

/**
 * Ein Tag pro Zeile, beginnend mit heute, dann rückwärts bis zum
 * Ende der Aufbewahrung. Ältere Tage gibt es nicht mehr, die hat
 * das Apps Script gelöscht.
 */
function zeichneListe() {
  el.liste.innerHTML = '';
  zeigeWerDran();

  const heuteSchluessel = schluessel(new Date());

  for (let i = 0; i < CONFIG.AUFBEWAHRUNG_TAGE; i++) {
    const tag = plusTage(new Date(), -i);
    el.liste.appendChild(tagZeile(tag, heuteSchluessel));
  }
}

function tagZeile(tag, heuteSchluessel) {
  const s = schluessel(tag);
  const dran = werIstDran(tag);
  const zeile = document.createElement('div');
  zeile.className = 'zeile';
  if (s === heuteSchluessel) zeile.classList.add('heute');

  const datumText = WOCHENTAGE[(tag.getDay() + 6) % 7] + ' '
                  + tag.getDate() + '.' + (tag.getMonth() + 1) + '.'
                  + (s === heuteSchluessel ? ' · heute' : '');

  if (dran === null) {
    zeile.classList.add('pause');
    zeile.innerHTML =
        '<div class="miniatur">Pause</div>'
      + '<div class="text"><div class="datum">' + datumText + '</div>'
      + '<div class="wer">Pausentag</div></div>';
    return zeile;
  }

  const ordner = ordnerFuer(dran);
  const treffer = ordner
    ? dateien.filter(function (d) {
        return d.tagSchluessel === s && d.ordner === ordner.name;
      })
    : [];
  treffer.sort(nachName);
  const datei = treffer[0];

  const miniatur = document.createElement('div');
  miniatur.className = 'miniatur';

  if (datei) {
    if (datei.thumbnailLink) {
      const img = document.createElement('img');
      img.src = datei.thumbnailLink.replace(/=s\d+$/, '=s200');
      img.referrerPolicy = 'no-referrer';
      img.alt = '';
      miniatur.appendChild(img);
    } else {
      miniatur.textContent = 'wird verarbeitet';
    }
    if (datei.mimeType.indexOf('video/') === 0) {
      const play = document.createElement('div');
      play.className = 'play';
      play.textContent = '▶';
      miniatur.appendChild(play);
    }
    miniatur.onclick = function () { oeffneOverlay(treffer, 0); };
  } else {
    zeile.classList.add('fehlt');
    miniatur.textContent = ordner ? '–' : 'kein Ordner';
  }

  zeile.appendChild(miniatur);

  const text = document.createElement('div');
  text.className = 'text';
  text.innerHTML = '<div class="datum">' + datumText + '</div>'
                 + '<div class="wer">' + escape_(dran) + '</div>';

  if (datei) {
    const rest = tageBisLoeschung(datei.createdTime);
    const zeit = document.createElement('div');
    zeit.className = 'rest' + (rest <= 3 ? ' bald' : '');
    const gesamtMb = treffer.reduce(function (summe, d) {
      return summe + (Number(d.size) || 0);
    }, 0);
    zeit.textContent = (treffer.length > 1 ? treffer.length + ' Clips · ' : '')
                     + mb(gesamtMb) + ' MB · noch ' + rest + ' Tage';
    text.appendChild(zeit);
  } else {
    const hinweis = document.createElement('div');
    hinweis.className = 'rest';
    hinweis.textContent = tag > new Date() ? 'steht noch aus' : 'kein Video';
    text.appendChild(hinweis);
  }

  zeile.appendChild(text);
  return zeile;
}


function pausenSlot() {
  const slot = document.createElement('div');
  slot.className = 'slot pause';
  slot.innerHTML = '<div class="bild">Pause</div><div class="name">frei</div>';
  return slot;
}

/** Sortiert nach Dateiname – der beginnt mit Datum und Uhrzeit. */
function nachName(a, b) {
  return a.name < b.name ? -1 : (a.name > b.name ? 1 : 0);
}

function vollerSlot(datei, name, ausserDerReihe, gruppe) {
  const liste = gruppe || [datei];
  const slot = document.createElement('div');
  slot.className = 'slot voll' + (ausserDerReihe ? ' zusatz' : '');

  const bild = document.createElement('div');
  bild.className = 'bild';

  if (datei.thumbnailLink) {
    const img = document.createElement('img');
    img.src = datei.thumbnailLink.replace(/=s\d+$/, '=s400');
    img.referrerPolicy = 'no-referrer';
    img.alt = '';
    bild.appendChild(img);
  } else {
    bild.textContent = 'wird verarbeitet';
  }

  if (datei.mimeType.indexOf('video/') === 0) {
    const play = document.createElement('div');
    play.className = 'play';
    play.textContent = '▶';
    bild.appendChild(play);
  }

  if (liste.length > 1) {
    const zaehler = document.createElement('div');
    zaehler.className = 'anzahl';
    zaehler.textContent = liste.length + ' Clips';
    bild.appendChild(zaehler);
  }

  bild.onclick = function () { oeffneOverlay(liste, 0); };
  slot.appendChild(bild);

  const beschriftung = document.createElement('div');
  beschriftung.className = 'name';
  beschriftung.textContent = name;
  beschriftung.title = datei.name + ' · ' + mb(datei.size) + ' MB';
  slot.appendChild(beschriftung);

  return slot;
}

function leererSlot(name, ohneOrdner) {
  const slot = document.createElement('div');
  slot.className = 'slot leer';
  slot.innerHTML = '<div class="bild">' + (ohneOrdner ? 'kein Ordner' : '–') + '</div>'
                 + '<div class="name">' + escape_(name) + '</div>';
  return slot;
}


// ============ OVERLAY ============

el.overlay.onclick = function (e) {
  if (e.target === el.overlay) schliesseOverlay();
};
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') schliesseOverlay();
});

function schliesseOverlay() {
  clearTimeout(bildTimer);
  el.overlay.hidden = true;
  el.overlayIn.innerHTML = '';
}

/**
 * Spielt eine ganze Tagesfolge ab: Ist ein Clip zu Ende, läuft der
 * nächste automatisch weiter. Der jeweils folgende wird schon
 * während des laufenden geladen, damit der Übergang nicht hakt.
 */
let wiedergabe = { liste: [], index: 0 };
let bildTimer = null;

function oeffneOverlay(eingabe, start) {
  wiedergabe.liste = Array.isArray(eingabe) ? eingabe : [eingabe];
  wiedergabe.index = start || 0;
  el.overlay.hidden = false;
  zeigeClip();
}

function naechsterClip() {
  if (wiedergabe.index + 1 >= wiedergabe.liste.length) return;
  wiedergabe.index++;
  zeigeClip();
}

function vorherigerClip() {
  if (wiedergabe.index === 0) return;
  wiedergabe.index--;
  zeigeClip();
}

async function zeigeClip() {
  clearTimeout(bildTimer);
  const datei = wiedergabe.liste[wiedergabe.index];
  if (!datei) return;

  el.overlayIn.innerHTML = '<div class="ladeanzeige">lädt …</div>';
  const ladeanzeige = el.overlayIn.firstElementChild;

  try {
    const url = await blobUrl(datei, function (p) {
      ladeanzeige.textContent = 'lädt … ' + p + ' %';
    });

    // Ist der Nutzer inzwischen weitergesprungen, nichts mehr tun
    if (wiedergabe.liste[wiedergabe.index] !== datei) return;

    el.overlayIn.innerHTML = '';

    let anzeige;
    if (datei.mimeType.indexOf('video/') === 0) {
      anzeige = document.createElement('video');
      anzeige.controls = true;
      anzeige.autoplay = true;
      anzeige.playsInline = true;
      anzeige.onended = naechsterClip;
      // Kann der Browser das Format nicht (typisch: HEVC vom iPhone
      // auf einem Android-Gerät), übernimmt Drives eigener Player.
      anzeige.onerror = function () { ersatzPlayer(datei, anzeige); };
    } else {
      anzeige = document.createElement('img');
      anzeige.className = 'voll';
      // Bilder haben keine Länge – sie bleiben eine feste Zeit stehen,
      // damit eine Folge aus Videos und Fotos gleichmäßig durchläuft.
      if (wiedergabe.liste.length > 1) {
        bildTimer = setTimeout(naechsterClip, CONFIG.BILD_SEKUNDEN * 1000);
      }
    }
    anzeige.src = url;
    el.overlayIn.appendChild(anzeige);
    el.overlayIn.appendChild(leiste(datei, url));

    vorladen();

  } catch (fehler) {
    el.overlayIn.innerHTML = '<div class="ersatz"><p>'
      + escape_(fehler.message) + '</p></div>';
  }
}

/** Holt den nächsten Clip still im Hintergrund. */
function vorladen() {
  const naechste = wiedergabe.liste[wiedergabe.index + 1];
  if (naechste && !naechste._url) {
    blobUrl(naechste).catch(function () {});
  }
}

function leiste(datei, url) {
  const l = document.createElement('div');
  l.className = 'leiste';

  const gesamt = wiedergabe.liste.length;
  const zaehler = gesamt > 1
    ? 'Clip ' + (wiedergabe.index + 1) + ' von ' + gesamt + ' · ' : '';

  const info = document.createElement('span');
  info.className = 'info';
  info.textContent = datei.vorschau
    ? zaehler + escape_(datei.name) + ' · ' + mb(datei.size) + ' MB · noch nicht hochgeladen'
    : zaehler + datei.ordner + ' · ' + mb(datei.size)
      + ' MB · noch ' + tageBisLoeschung(datei.createdTime) + ' Tage';
  l.appendChild(info);

  if (gesamt > 1) {
    const zurueck = document.createElement('button');
    zurueck.textContent = '‹';
    zurueck.title = 'vorheriger Clip';
    zurueck.disabled = wiedergabe.index === 0;
    zurueck.onclick = vorherigerClip;
    l.appendChild(zurueck);

    const weiter = document.createElement('button');
    weiter.textContent = '›';
    weiter.title = 'nächster Clip';
    weiter.disabled = wiedergabe.index + 1 >= gesamt;
    weiter.onclick = naechsterClip;
    l.appendChild(weiter);
  }

  if (!datei.vorschau) {
    const laden = document.createElement('button');
    laden.textContent = 'Herunterladen';
    laden.onclick = function () {
      const a = document.createElement('a');
      a.href = url;
      a.download = datei.name;
      a.click();
    };
    l.appendChild(laden);
  }

  const zu = document.createElement('button');
  zu.textContent = 'Schließen';
  zu.onclick = schliesseOverlay;
  l.appendChild(zu);

  return l;
}

function ersatzPlayer(datei, videoElement) {
  const kasten = document.createElement('div');
  kasten.className = 'ersatz';
  kasten.innerHTML = '<p>Dieser Browser kann das Format nicht abspielen.<br>'
                   + 'Meist ein iPhone-Video (HEVC) auf einem Android-Gerät.</p>';

  const knopf = document.createElement('button');
  knopf.textContent = 'Im Drive-Player öffnen';
  knopf.onclick = function () {
    window.open('https://drive.google.com/file/d/' + datei.id + '/view',
                '_blank', 'noopener');
  };
  kasten.appendChild(knopf);
  videoElement.replaceWith(kasten);
}

function tageBisLoeschung(erstellt) {
  const weg = new Date(erstellt).getTime() + CONFIG.AUFBEWAHRUNG_TAGE * 86400000;
  return Math.max(0, Math.ceil((weg - Date.now()) / 86400000));
}

async function blobUrl(datei, fortschritt) {
  if (datei._url) return datei._url;

  const antwort = await fetch(
    'https://www.googleapis.com/drive/v3/files/' + datei.id + '?alt=media',
    { headers: { Authorization: 'Bearer ' + token } }
  );
  if (!antwort.ok) throw new Error('Konnte Datei nicht laden (' + antwort.status + ')');

  const gesamt = Number(datei.size || 0);
  const leser = antwort.body.getReader();
  const teile = [];
  let geladen = 0;

  while (true) {
    const stueck = await leser.read();
    if (stueck.done) break;
    teile.push(stueck.value);
    geladen += stueck.value.length;
    if (gesamt && fortschritt) fortschritt(Math.round(geladen / gesamt * 100));
  }

  datei._url = URL.createObjectURL(new Blob(teile, { type: datei.mimeType }));
  return datei._url;
}


// ============ HOCHLADEN ============

el.waehlen.onclick = function () { el.datei.click(); };

/**
 * Ausgewählte Dateien landen erst in dieser Liste. Dort lässt sich
 * die Reihenfolge ändern, einzelne entfernen und das Ganze vorab
 * ansehen. Hochgeladen wird erst auf Knopfdruck.
 */
let entwurf = [];

el.datei.onchange = function () {
  Array.prototype.slice.call(el.datei.files).forEach(function (datei) {
    entwurf.push({
      datei: datei,
      url: URL.createObjectURL(datei),
      name: datei.name,
      mimeType: datei.type || 'application/octet-stream',
      size: datei.size
    });
  });
  el.datei.value = '';
  zeichneEntwurf();
};

function zeichneEntwurf() {
  el.composer.hidden = entwurf.length === 0;
  if (!entwurf.length) return;

  el.cTitel.textContent = entwurf.length
    + (entwurf.length === 1 ? ' Datei bereit' : ' Dateien bereit');

  el.cListe.innerHTML = '';

  entwurf.forEach(function (eintrag, i) {
    const li = document.createElement('li');
    li.className = 'eintrag';

    const nr = document.createElement('span');
    nr.className = 'nr';
    nr.textContent = (i + 1) + '.';
    li.appendChild(nr);

    const mini = document.createElement('div');
    mini.className = 'mini';
    if (eintrag.mimeType.indexOf('video/') === 0) {
      // Ein stummes Video zeigt seinen ersten Frame – das ist
      // billiger als selbst ein Vorschaubild zu berechnen.
      const v = document.createElement('video');
      v.src = eintrag.url + '#t=0.1';
      v.muted = true;
      v.playsInline = true;
      v.preload = 'metadata';
      mini.appendChild(v);
    } else {
      const img = document.createElement('img');
      img.src = eintrag.url;
      img.alt = '';
      mini.appendChild(img);
    }
    li.appendChild(mini);

    const text = document.createElement('div');
    text.className = 'beschriftung';
    text.innerHTML = '<div class="dateiname">' + escape_(eintrag.name) + '</div>'
      + '<div class="klein">' + mb(eintrag.size) + ' MB · '
      + (eintrag.mimeType.indexOf('video/') === 0
          ? 'Video' : 'Bild, ' + CONFIG.BILD_SEKUNDEN + ' Sek.')
      + '</div>';
    li.appendChild(text);

    const knoepfe = document.createElement('div');
    knoepfe.className = 'knoepfe';

    const hoch = document.createElement('button');
    hoch.textContent = '↑';
    hoch.title = 'nach vorne';
    hoch.disabled = i === 0;
    hoch.onclick = function () { tausche(i, i - 1); };
    knoepfe.appendChild(hoch);

    const runter = document.createElement('button');
    runter.textContent = '↓';
    runter.title = 'nach hinten';
    runter.disabled = i === entwurf.length - 1;
    runter.onclick = function () { tausche(i, i + 1); };
    knoepfe.appendChild(runter);

    const weg = document.createElement('button');
    weg.textContent = '✕';
    weg.title = 'entfernen';
    weg.onclick = function () { entferne(i); };
    knoepfe.appendChild(weg);

    li.appendChild(knoepfe);
    el.cListe.appendChild(li);
  });
}

function tausche(a, b) {
  const merk = entwurf[a];
  entwurf[a] = entwurf[b];
  entwurf[b] = merk;
  zeichneEntwurf();
}

function entferne(i) {
  URL.revokeObjectURL(entwurf[i].url);
  entwurf.splice(i, 1);
  zeichneEntwurf();
}

function leereEntwurf() {
  entwurf.forEach(function (e) { URL.revokeObjectURL(e.url); });
  entwurf = [];
  zeichneEntwurf();
}

document.getElementById('mehr').onclick = function () { el.datei.click(); };
document.getElementById('verwerfen').onclick = leereEntwurf;

/** Spielt den Entwurf ab, ohne dass etwas hochgeladen wurde. */
document.getElementById('vorschau').onclick = function () {
  if (!entwurf.length) return;
  oeffneOverlay(entwurf.map(function (e) {
    return {
      name: e.name,
      mimeType: e.mimeType,
      size: e.size,
      ordner: 'Vorschau',
      createdTime: new Date().toISOString(),
      vorschau: true,
      _url: e.url          // schon vorhanden, blobUrl lädt nichts nach
    };
  }), 0);
};

document.getElementById('absenden').onclick = async function () {
  if (!entwurf.length) return;

  const ordnerId = el.person.value;
  if (!ordnerId) {
    zeigeFehler('Bitte zuerst auswählen, wer du bist.');
    return;
  }

  el.fehler.hidden = true;
  el.waehlen.disabled = true;
  el.balken.hidden = false;
  setzeBalken(0);

  const fuerTag = plusTage(new Date(), -Number(el.fuer.value || 0));

  try {
    // Nacheinander, nicht gleichzeitig – sonst konkurrieren die
    // Uploads um dieselbe Leitung und alle werden langsamer.
    for (let i = 0; i < entwurf.length; i++) {
      const nummer = entwurf.length > 1
        ? ' (' + (i + 1) + ' von ' + entwurf.length + ')' : '';

      await hochladen(entwurf[i].datei, ordnerId, function (prozent) {
        setzeBalken(prozent);
        el.hlStatus.textContent = 'lädt hoch' + nummer + ' … ' + prozent + ' %';
      }, fuerTag, i);
    }
    el.hlStatus.textContent = 'fertig';
    leereEntwurf();
    wochenStart = montagVon(new Date());
    await laden();
  } catch (fehler) {
    el.hlStatus.textContent = '';
    zeigeFehler(fehler.message);
  } finally {
    el.waehlen.disabled = false;
    el.balken.hidden = true;
    el.fuer.value = '0';   // beim nächsten Mal wieder "heute"
    merkePerson();
  }
};

function setzeBalken(p) { el.balken.firstElementChild.style.width = p + '%'; }

/** HHMMSS plus laufende Nummer, damit die Sortierung eindeutig bleibt. */
function uhrzeitMarke(lfdNr) {
  const d = new Date();
  return String(d.getHours()).padStart(2, '0')
       + String(d.getMinutes()).padStart(2, '0')
       + String(d.getSeconds()).padStart(2, '0')
       + String(lfdNr || 0).padStart(2, '0');
}

/**
 * Wiederaufnehmbarer Upload: erst eine Upload-Adresse anfordern,
 * dann geht die Datei direkt vom Browser zu Google. XMLHttpRequest
 * statt fetch, weil nur das einen Fortschritt meldet.
 */
async function hochladen(datei, ordnerId, fortschritt, fuerTag, lfdNr) {
  // Datum vorn für die Zuordnung zum Tag, danach eine Uhrzeit,
  // damit mehrere Clips eines Tages in der Reihenfolge bleiben,
  // in der sie aufgenommen wurden.
  const name = schluessel(fuerTag || new Date()) + '_'
             + uhrzeitMarke(lfdNr) + '_' + datei.name;

  const start = await fetch(
    'https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable',
    {
      method: 'POST',
      headers: {
        Authorization: 'Bearer ' + token,
        'Content-Type': 'application/json; charset=UTF-8',
        'X-Upload-Content-Type': datei.type || 'application/octet-stream',
        'X-Upload-Content-Length': datei.size
      },
      body: JSON.stringify({ name: name, parents: [ordnerId] })
    }
  );

  if (!start.ok) {
    throw new Error('Upload konnte nicht gestartet werden ('
                    + start.status + '):\n' + (await start.text()));
  }

  const sitzung = start.headers.get('Location');
  if (!sitzung) throw new Error('Google hat keine Upload-Adresse zurückgegeben.');

  return new Promise(function (fertig, fehlgeschlagen) {
    const xhr = new XMLHttpRequest();
    xhr.open('PUT', sitzung);
    xhr.setRequestHeader('Content-Type', datei.type || 'application/octet-stream');

    xhr.upload.onprogress = function (e) {
      if (e.lengthComputable) fortschritt(Math.round(e.loaded / e.total * 100));
    };
    xhr.onload = function () {
      if (xhr.status >= 200 && xhr.status < 300) fertig(JSON.parse(xhr.responseText || '{}'));
      else fehlgeschlagen(new Error('Upload fehlgeschlagen ('
                          + xhr.status + '):\n' + xhr.responseText));
    };
    xhr.onerror = function () {
      fehlgeschlagen(new Error('Netzwerkfehler beim Hochladen.'));
    };
    xhr.send(datei);
  });
}

function fuellePersonen() {
  const vorher = el.person.value || gemerktePerson();
  el.person.innerHTML = '';

  if (!unterordner.length) {
    const leer = document.createElement('option');
    leer.textContent = '(kein Unterordner gefunden)';
    leer.value = '';
    el.person.appendChild(leer);
    return;
  }

  unterordner.forEach(function (o) {
    const option = document.createElement('option');
    option.value = o.id;
    option.textContent = o.name;
    el.person.appendChild(option);
  });

  if (vorher) el.person.value = vorher;
}

el.person.onchange = merkePerson;

function merkePerson() {
  try { localStorage.setItem('videotagebuch.person', el.person.value); } catch (e) {}
}
function gemerktePerson() {
  try { return localStorage.getItem('videotagebuch.person'); } catch (e) { return null; }
}


// ============ KLEINKRAM ============

function mb(bytes) { return Math.round((Number(bytes) || 0) / 1048576); }

function escape_(text) {
  const d = document.createElement('div');
  d.textContent = text;
  return d.innerHTML;
}

function zeigeFehler(text) {
  el.fehler.textContent = text;
  el.fehler.hidden = false;
}
</script>
