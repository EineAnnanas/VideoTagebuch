<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Videotagebuch</title>

<!--
  ============================================================
   VIDEOTAGEBUCH – Ansehen und Hochladen
  ============================================================

   Eine einzige Datei, kein Build, kein npm.
   Läuft auf GitHub Pages.

   Ablauf: Anmeldung mit dem eigenen Projekt-Konto bei Google,
   danach liest und schreibt der Browser direkt mit Drive.
   Die Seite selbst speichert nichts und kennt kein Passwort.

   Hochgeladene Dateien gehören dem angemeldeten Konto – dadurch
   zählt der Speicher gegen dieses Konto und dessen Apps Script
   darf sie nach 30 Tagen endgültig löschen.

   Einrichtung: siehe README.md
  ============================================================
-->

<style>
  :root {
    --rand: #ddd;
    --grau: #666;
  }
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, sans-serif;
    margin: 0 auto;
    padding: 1rem;
    max-width: 900px;
    line-height: 1.5;
  }
  header {
    display: flex;
    align-items: baseline;
    gap: 1rem;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--rand);
    padding-bottom: .75rem;
    margin-bottom: 1rem;
  }
  h1 { font-size: 1.25rem; margin: 0; }

  button, select {
    font: inherit;
    padding: .4rem .8rem;
    border: 1px solid var(--rand);
    background: #fff;
    cursor: pointer;
    border-radius: 4px;
  }
  button:hover:not(:disabled) { background: #f5f5f5; }
  button:disabled { opacity: .5; cursor: default; }

  #hochladen-bereich {
    border: 1px solid var(--rand);
    border-radius: 4px;
    padding: .75rem;
    margin-bottom: 1.5rem;
    display: flex;
    align-items: center;
    gap: .75rem;
    flex-wrap: wrap;
  }
  #hochladen-bereich label { font-size: .85rem; color: var(--grau); }
  #balken {
    flex-basis: 100%;
    height: 6px;
    background: #eee;
    border-radius: 3px;
    overflow: hidden;
  }
  #balken > div { height: 100%; width: 0; background: #333; transition: width .2s; }

  .tag { margin-bottom: 2rem; }
  .tag > h2 {
    font-size: .95rem;
    font-weight: 600;
    margin: 0 0 .6rem;
    padding-bottom: .3rem;
    border-bottom: 1px solid var(--rand);
  }
  .tag > h2 span { font-weight: 400; color: var(--grau); }

  .raster {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: .75rem;
  }
  .karte { border: 1px solid var(--rand); border-radius: 4px; overflow: hidden; }
  .karte .vorschau {
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #f0f0f0;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    position: relative;
    font-size: .8rem;
    color: var(--grau);
  }
  .karte .vorschau img { width: 100%; height: 100%; object-fit: cover; }
  .karte .vorschau .play {
    position: absolute;
    font-size: 1.5rem;
    color: #fff;
    text-shadow: 0 0 8px rgba(0,0,0,.7);
    pointer-events: none;
  }
  .karte video, .karte img.voll { width: 100%; display: block; }
  .karte .info { padding: .5rem .6rem; font-size: .8rem; }
  .karte .info .person { font-weight: 600; }
  .karte .info .meta { color: var(--grau); word-break: break-all; }
  .karte .info .bald { color: #b00; }
  .karte .ersatz {
    padding: .75rem .6rem;
    font-size: .8rem;
    background: #f7f7f7;
  }
  .karte .ersatz p { margin: 0 0 .5rem; color: var(--grau); }
  .karte .ersatz button { font-size: .75rem; padding: .2rem .5rem; }

  .karte .aktionen { padding: 0 .6rem .6rem; }
  .karte .aktionen button { font-size: .75rem; padding: .2rem .5rem; }

  #status { color: var(--grau); }
  #fehler {
    color: #b00;
    white-space: pre-wrap;
    font-size: .85rem;
    border: 1px solid #b00;
    padding: .75rem;
    border-radius: 4px;
    margin-bottom: 1rem;
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<header>
  <h1>Videotagebuch</h1>
  <button id="anmelden">Mit Google anmelden</button>
  <button id="neuladen" hidden>Neu laden</button>
</header>

<div id="hochladen-bereich" hidden>
  <label for="person">Ich bin</label>
  <select id="person"></select>
  <button id="waehlen">Video auswählen</button>
  <input type="file" id="datei" accept="video/*,image/*" hidden>
  <span id="hochladen-status"></span>
  <div id="balken" hidden><div></div></div>
</div>

<div id="fehler" hidden></div>
<p id="status">Nicht angemeldet.</p>
<main id="inhalt"></main>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
// ============ EINSTELLUNGEN ============

const CONFIG = {

  CLIENT_ID: '162999381232-kmusrtl8hsnp8ilr8dg71pb7q9udobnm.apps.googleusercontent.com',

  // Der Hauptordner "Videotagebuch"
  ORDNER_ID: '1quX3ETKLsfNxEIsOpiOXHOgrcbtJnsBb',

  AUFBEWAHRUNG_TAGE: 30,

  // Vollzugriff auf Drive. Klingt nach viel, ist hier aber das
  // Richtige: Der eingeschränkte Bereich drive.file darf nur
  // Dateien anfassen, die die App selbst angelegt hat – dann
  // sähe niemand die Videos der anderen. Die Projekt-Konten
  // enthalten ohnehin nichts außer diesem Ordner.
  BEREICH: 'https://www.googleapis.com/auth/drive'
};


// ============ ZUSTAND ============

let token = null;
let tokenClient = null;
let unterordner = [];

const el = {
  anmelden:  document.getElementById('anmelden'),
  neuladen:  document.getElementById('neuladen'),
  status:    document.getElementById('status'),
  fehler:    document.getElementById('fehler'),
  inhalt:    document.getElementById('inhalt'),
  bereich:   document.getElementById('hochladen-bereich'),
  person:    document.getElementById('person'),
  waehlen:   document.getElementById('waehlen'),
  datei:     document.getElementById('datei'),
  hlStatus:  document.getElementById('hochladen-status'),
  balken:    document.getElementById('balken')
};


// ============ ANMELDUNG ============

window.onload = function () {
  if (CONFIG.CLIENT_ID.indexOf('apps.googleusercontent.com') === -1) {
    zeigeFehler('Es ist noch keine CLIENT_ID eingetragen. Siehe README.md.');
    el.anmelden.disabled = true;
    return;
  }

  const warten = setInterval(function () {
    if (!window.google || !google.accounts) return;
    clearInterval(warten);

    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: CONFIG.CLIENT_ID,
      scope: CONFIG.BEREICH,
      callback: function (antwort) {
        if (antwort.error) {
          zeigeFehler('Anmeldung fehlgeschlagen: ' + antwort.error);
          return;
        }
        token = antwort.access_token;
        el.anmelden.hidden = true;
        el.neuladen.hidden = false;
        el.bereich.hidden = false;
        laden();
      }
    });
  }, 100);
};

el.anmelden.onclick = function () { tokenClient.requestAccessToken(); };
el.neuladen.onclick = function () { laden(); };


// ============ DRIVE LESEN ============

async function drive(pfad, params) {
  const url = new URL('https://www.googleapis.com/drive/v3/' + pfad);
  Object.keys(params || {}).forEach(function (k) {
    url.searchParams.set(k, params[k]);
  });

  const antwort = await fetch(url, {
    headers: { Authorization: 'Bearer ' + token }
  });

  if (antwort.status === 401) {
    token = null;
    tokenClient.requestAccessToken({ prompt: '' });
    throw new Error('Sitzung abgelaufen. Bitte noch einmal anmelden.');
  }
  if (!antwort.ok) {
    throw new Error('Drive antwortete mit ' + antwort.status + ':\n'
                    + (await antwort.text()));
  }
  return antwort.json();
}

async function ordnerHolen() {
  const antwort = await drive('files', {
    q: "'" + CONFIG.ORDNER_ID + "' in parents"
       + " and mimeType='application/vnd.google-apps.folder'"
       + " and trashed=false",
    fields: 'files(id,name)',
    orderBy: 'name',
    pageSize: 100
  });
  return antwort.files;
}

async function alleDateien() {
  const quellen = [{ id: CONFIG.ORDNER_ID, name: '(Hauptordner)' }]
                    .concat(unterordner);
  const ergebnis = [];

  for (const ordner of quellen) {
    const inhalt = await drive('files', {
      q: "'" + ordner.id + "' in parents"
         + " and mimeType!='application/vnd.google-apps.folder'"
         + " and trashed=false",
      fields: 'files(id,name,mimeType,createdTime,size,thumbnailLink)',
      orderBy: 'createdTime desc',
      pageSize: 200
    });
    inhalt.files.forEach(function (datei) {
      datei.ordner = ordner.name;
      ergebnis.push(datei);
    });
  }
  return ergebnis;
}


// ============ HOCHLADEN ============

el.waehlen.onclick = function () { el.datei.click(); };

el.datei.onchange = async function () {
  const datei = el.datei.files[0];
  if (!datei) return;

  const ordnerId = el.person.value;
  if (!ordnerId) {
    zeigeFehler('Bitte zuerst auswählen, wer du bist.');
    return;
  }

  el.fehler.hidden = true;
  el.waehlen.disabled = true;
  el.balken.hidden = false;
  setzeBalken(0);
  el.hlStatus.textContent = 'lädt hoch …';

  try {
    await hochladen(datei, ordnerId, function (prozent) {
      setzeBalken(prozent);
      el.hlStatus.textContent = 'lädt hoch … ' + prozent + ' %';
    });
    el.hlStatus.textContent = 'fertig';
    await laden();
  } catch (fehler) {
    el.hlStatus.textContent = '';
    zeigeFehler(fehler.message);
  } finally {
    el.waehlen.disabled = false;
    el.balken.hidden = true;
    el.datei.value = '';
    merkePerson();
  }
};

function setzeBalken(prozent) {
  el.balken.firstElementChild.style.width = prozent + '%';
}

/**
 * Wiederaufnehmbarer Upload: Erst wird eine Upload-Adresse
 * angefordert, dann geht die Datei direkt vom Browser zu Google.
 * XMLHttpRequest statt fetch, weil nur das einen Fortschritt meldet.
 */
async function hochladen(datei, ordnerId, fortschritt) {
  const name = heute() + '_' + datei.name;

  const start = await fetch(
    'https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable',
    {
      method: 'POST',
      headers: {
        Authorization: 'Bearer ' + token,
        'Content-Type': 'application/json; charset=UTF-8',
        'X-Upload-Content-Type': datei.type || 'application/octet-stream',
        'X-Upload-Content-Length': datei.size
      },
      body: JSON.stringify({ name: name, parents: [ordnerId] })
    }
  );

  if (!start.ok) {
    throw new Error('Upload konnte nicht gestartet werden ('
                    + start.status + '):\n' + (await start.text()));
  }

  const sitzung = start.headers.get('Location');
  if (!sitzung) {
    throw new Error('Google hat keine Upload-Adresse zurückgegeben.');
  }

  return new Promise(function (fertig, fehlgeschlagen) {
    const xhr = new XMLHttpRequest();
    xhr.open('PUT', sitzung);
    xhr.setRequestHeader('Content-Type', datei.type || 'application/octet-stream');

    xhr.upload.onprogress = function (e) {
      if (e.lengthComputable) {
        fortschritt(Math.round(e.loaded / e.total * 100));
      }
    };
    xhr.onload = function () {
      if (xhr.status >= 200 && xhr.status < 300) {
        fertig(JSON.parse(xhr.responseText || '{}'));
      } else {
        fehlgeschlagen(new Error('Upload fehlgeschlagen ('
                       + xhr.status + '):\n' + xhr.responseText));
      }
    };
    xhr.onerror = function () {
      fehlgeschlagen(new Error('Netzwerkfehler beim Hochladen.'));
    };
    xhr.send(datei);
  });
}

function heute() {
  const d = new Date();
  return d.getFullYear() + '-'
       + String(d.getMonth() + 1).padStart(2, '0') + '-'
       + String(d.getDate()).padStart(2, '0');
}

function merkePerson() {
  try { localStorage.setItem('videotagebuch.person', el.person.value); } catch (e) {}
}
function gemerktePerson() {
  try { return localStorage.getItem('videotagebuch.person'); } catch (e) { return null; }
}


// ============ ANZEIGE ============

async function laden() {
  el.fehler.hidden = true;
  el.status.hidden = false;
  el.status.textContent = 'Lade …';
  el.inhalt.innerHTML = '';

  try {
    unterordner = await ordnerHolen();
    fuellePersonen();

    const dateien = await alleDateien();

    if (!dateien.length) {
      el.status.textContent = 'Noch nichts da.';
      return;
    }
    el.status.hidden = true;

    const tage = {};
    dateien.forEach(function (d) {
      const schluessel = new Date(d.createdTime).toLocaleDateString('de-DE');
      (tage[schluessel] = tage[schluessel] || []).push(d);
    });

    Object.keys(tage)
      .sort(function (a, b) { return datum(b) - datum(a); })
      .forEach(function (tag) {
        el.inhalt.appendChild(tagBlock(tag, tage[tag]));
      });

  } catch (fehler) {
    el.status.hidden = true;
    zeigeFehler(fehler.message);
  }
}

function fuellePersonen() {
  const vorher = el.person.value || gemerktePerson();
  el.person.innerHTML = '';

  if (!unterordner.length) {
    const leer = document.createElement('option');
    leer.textContent = '(kein Unterordner gefunden)';
    leer.value = '';
    el.person.appendChild(leer);
    return;
  }

  unterordner.forEach(function (o) {
    const option = document.createElement('option');
    option.value = o.id;
    option.textContent = o.name;
    el.person.appendChild(option);
  });

  if (vorher) el.person.value = vorher;
}

el.person.onchange = merkePerson;

function datum(deutsch) {
  const t = deutsch.split('.');
  return new Date(t[2], t[1] - 1, t[0]).getTime();
}

function tagBlock(tag, dateien) {
  const block = document.createElement('section');
  block.className = 'tag';

  const rest = tageBisLoeschung(dateien[0].createdTime);
  const kopf = document.createElement('h2');
  kopf.innerHTML = tag + ' <span>· ' + dateien.length + ' Datei'
                 + (dateien.length > 1 ? 'en' : '')
                 + ' · noch ' + rest + ' Tage</span>';
  block.appendChild(kopf);

  const raster = document.createElement('div');
  raster.className = 'raster';
  dateien.forEach(function (d) { raster.appendChild(karte(d)); });
  block.appendChild(raster);

  return block;
}

function tageBisLoeschung(erstellt) {
  const weg = new Date(erstellt).getTime()
            + CONFIG.AUFBEWAHRUNG_TAGE * 86400000;
  return Math.max(0, Math.ceil((weg - Date.now()) / 86400000));
}

function karte(datei) {
  const k = document.createElement('div');
  k.className = 'karte';

  const vorschau = document.createElement('div');
  vorschau.className = 'vorschau';

  if (datei.thumbnailLink) {
    const bild = document.createElement('img');
    bild.src = datei.thumbnailLink.replace(/=s\d+$/, '=s400');
    bild.referrerPolicy = 'no-referrer';
    bild.alt = '';
    vorschau.appendChild(bild);
  } else {
    vorschau.textContent = 'wird noch verarbeitet';
  }

  if (datei.mimeType.indexOf('video/') === 0) {
    const play = document.createElement('div');
    play.className = 'play';
    play.textContent = '▶';
    vorschau.appendChild(play);
  }
  vorschau.onclick = function () { oeffnen(datei, k, vorschau); };
  k.appendChild(vorschau);

  const rest = tageBisLoeschung(datei.createdTime);
  const info = document.createElement('div');
  info.className = 'info';
  info.innerHTML =
      '<div class="person">' + escape_(datei.ordner) + '</div>'
    + '<div class="meta">' + escape_(datei.name) + ' · ' + mb(datei.size) + ' MB</div>'
    + '<div class="' + (rest <= 3 ? 'bald' : 'meta') + '">noch ' + rest + ' Tage</div>';
  k.appendChild(info);

  const aktionen = document.createElement('div');
  aktionen.className = 'aktionen';
  const knopf = document.createElement('button');
  knopf.textContent = 'Herunterladen';
  knopf.onclick = function () { herunterladen(datei, knopf); };
  aktionen.appendChild(knopf);
  k.appendChild(aktionen);

  return k;
}

async function oeffnen(datei, karte, vorschau) {
  if (karte.dataset.offen) return;
  karte.dataset.offen = '1';

  const platzhalter = document.createElement('div');
  platzhalter.className = 'vorschau';
  platzhalter.textContent = 'lädt …';
  vorschau.replaceWith(platzhalter);

  try {
    const url = await blobUrl(datei, function (prozent) {
      platzhalter.textContent = 'lädt … ' + prozent + ' %';
    });

    let anzeige;
    if (datei.mimeType.indexOf('video/') === 0) {
      anzeige = document.createElement('video');
      anzeige.controls = true;
      anzeige.autoplay = true;
      anzeige.playsInline = true;

      // Kann dieser Browser das Format nicht (typisch: HEVC aus
      // einem iPhone, geöffnet in Chrome auf Android), springt
      // der Drive-Player ein. Google legt beim Hochladen eine
      // umgewandelte Fassung an, die überall läuft.
      anzeige.onerror = function () { ersatzPlayer(datei, anzeige); };

    } else {
      anzeige = document.createElement('img');
      anzeige.className = 'voll';
    }
    anzeige.src = url;
    platzhalter.replaceWith(anzeige);

  } catch (fehler) {
    platzhalter.textContent = 'Fehler';
    zeigeFehler(fehler.message);
    delete karte.dataset.offen;
  }
}

/**
 * Wird aufgerufen, wenn der Browser das Video nicht abspielen kann.
 * Bietet Drives eigenen Player an, der eine umgewandelte Fassung
 * ausliefert – die läuft auch dort, wo HEVC fehlt.
 */
function ersatzPlayer(datei, videoElement) {
  const kasten = document.createElement('div');
  kasten.className = 'ersatz';
  kasten.innerHTML =
      '<p>Dieser Browser kann das Format nicht abspielen.<br>'
    + 'Meist ein iPhone-Video (HEVC) auf einem Android-Gerät.</p>';

  const knopf = document.createElement('button');
  knopf.textContent = 'Im Drive-Player öffnen';
  knopf.onclick = function () {
    window.open('https://drive.google.com/file/d/' + datei.id + '/view',
                '_blank', 'noopener');
  };
  kasten.appendChild(knopf);

  videoElement.replaceWith(kasten);
}

async function herunterladen(datei, knopf) {
  const beschriftung = knopf.textContent;
  knopf.disabled = true;
  try {
    const url = await blobUrl(datei, function (p) { knopf.textContent = p + ' %'; });
    const a = document.createElement('a');
    a.href = url;
    a.download = datei.name;
    a.click();
    knopf.textContent = beschriftung;
  } catch (fehler) {
    knopf.textContent = 'Fehler';
    zeigeFehler(fehler.message);
  } finally {
    knopf.disabled = false;
  }
}

async function blobUrl(datei, fortschritt) {
  if (datei._url) return datei._url;

  const antwort = await fetch(
    'https://www.googleapis.com/drive/v3/files/' + datei.id + '?alt=media',
    { headers: { Authorization: 'Bearer ' + token } }
  );
  if (!antwort.ok) {
    throw new Error('Konnte Datei nicht laden (' + antwort.status + ')');
  }

  const gesamt = Number(datei.size || 0);
  const leser = antwort.body.getReader();
  const teile = [];
  let geladen = 0;

  while (true) {
    const stueck = await leser.read();
    if (stueck.done) break;
    teile.push(stueck.value);
    geladen += stueck.value.length;
    if (gesamt && fortschritt) {
      fortschritt(Math.round(geladen / gesamt * 100));
    }
  }

  datei._url = URL.createObjectURL(new Blob(teile, { type: datei.mimeType }));
  return datei._url;
}


// ============ KLEINKRAM ============

function mb(bytes) { return Math.round((Number(bytes) || 0) / 1048576); }

function escape_(text) {
  const d = document.createElement('div');
  d.textContent = text;
  return d.innerHTML;
}

function zeigeFehler(text) {
  el.fehler.textContent = text;
  el.fehler.hidden = false;
}
</script>
</body>
</html>
