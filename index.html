<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Videotagebuch</title>

<!--
  ============================================================
   VIDEOTAGEBUCH
  ============================================================

   Eine einzige Datei, kein Build, kein npm. Läuft auf GitHub Pages.

   Ansicht: Zeitleiste mit Datumsspalte links, darunter die
   Belegungsübersicht. Das Wochenraster gibt es als Umschaltung.

   Anmeldung mit dem eigenen Projekt-Konto, danach spricht der
   Browser direkt mit Drive. Die Seite speichert nichts und kennt
   kein Passwort.

   Einrichtung: siehe README.md
  ============================================================
-->

<style>
  :root {
    --papier:  #faf9f5;
    --flaeche: #fffefb;
    --rand:    #e3e0d6;
    --text:    #2c2b26;
    --grau:    #8a877c;
    --blass:   #c3bfb1;
    --platz:   #e6e2d5;
    --serif:   Georgia, 'Iowan Old Style', 'Times New Roman', serif;
  }
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: var(--papier);
    color: var(--text);
    margin: 0 auto;
    padding: 1.25rem 1rem 3rem;
    max-width: 820px;
    line-height: 1.5;
  }

  header {
    display: flex;
    align-items: baseline;
    gap: .6rem;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--rand);
    padding-bottom: .9rem;
    margin-bottom: 1.25rem;
  }
  h1 {
    font-family: var(--serif);
    font-size: 1.5rem;
    font-weight: normal;
    margin: 0;
    margin-right: auto;
  }

  /* ---- Knöpfe ----
     Drei Stufen: normal, wichtig (dunkel gefüllt), leise (ohne
     Rahmen). Mindesthöhe 36 px, damit sie am Handy gut zu treffen
     sind. Der Hover-Effekt gilt nur für Geräte mit Mauszeiger –
     auf Touchscreens bleibt er sonst nach dem Tippen kleben. */
  button, select {
    font: inherit;
    font-size: .84rem;
    line-height: 1;
    padding: .55rem .85rem;
    min-height: 36px;
    border: 1px solid var(--rand);
    background: var(--flaeche);
    color: var(--text);
    cursor: pointer;
    border-radius: 6px;
    transition: background .12s ease, border-color .12s ease;
  }
  select { padding-right: .5rem; }

  @media (hover: hover) {
    button:hover:not(:disabled) { background: #f3f1e9; border-color: var(--blass); }
  }
  button:active:not(:disabled) { background: #eae7db; }
  button:focus-visible { outline: 2px solid var(--text); outline-offset: 1px; }
  button:disabled { opacity: .35; cursor: default; }

  button.wichtig {
    background: var(--text);
    border-color: var(--text);
    color: var(--papier);
  }
  @media (hover: hover) {
    button.wichtig:hover:not(:disabled) { background: #45433b; border-color: #45433b; }
  }
  button.wichtig:active:not(:disabled) { background: #1e1d19; }

  button.leise {
    background: transparent;
    border-color: transparent;
    color: var(--grau);
  }
  @media (hover: hover) {
    button.leise:hover:not(:disabled) { background: rgba(44,43,38,.06); border-color: transparent; }
  }

  button.symbol {
    padding: 0;
    width: 36px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
  }

  /* ---- Hochladen ---- */
  #hochladen-bereich {
    border: 1px solid var(--rand);
    border-radius: 4px;
    background: var(--flaeche);
    padding: .7rem;
    margin-bottom: 1.25rem;
    display: flex;
    align-items: center;
    gap: .6rem;
    flex-wrap: wrap;
  }
  #hochladen-bereich label { font-size: .8rem; color: var(--grau); }
  #hochladen-status { font-size: .8rem; color: var(--grau); }
  #balken {
    flex-basis: 100%;
    height: 4px;
    background: var(--platz);
    border-radius: 2px;
    overflow: hidden;
  }
  #balken > div { height: 100%; width: 0; background: var(--text); transition: width .2s; }

  /* ---- Zusammenstellen vor dem Hochladen ---- */
  #composer {
    border: 1px solid var(--text);
    border-radius: 4px;
    background: var(--flaeche);
    padding: .8rem;
    margin-bottom: 1.25rem;
  }
  #composer-titel { font-family: var(--serif); font-size: 1.05rem; }
  #composer .hinweis { display: block; font-size: .78rem; color: var(--grau); }
  #composer-liste {
    list-style: none;
    margin: .7rem 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: .35rem;
  }
  .eintrag {
    display: flex;
    align-items: center;
    gap: .55rem;
    border: 1px solid var(--rand);
    border-radius: 3px;
    padding: .35rem;
  }
  .eintrag .nr { font-size: .78rem; color: var(--grau); width: 1.1rem; text-align: center; flex: 0 0 auto; }
  .eintrag .mini {
    width: 50px; height: 50px; flex: 0 0 50px;
    background: var(--platz); border-radius: 2px; overflow: hidden;
  }
  .eintrag .mini img, .eintrag .mini video {
    width: 100%; height: 100%; object-fit: cover; display: block;
  }
  .eintrag .beschriftung { flex: 1 1 auto; min-width: 0; font-size: .8rem; }
  .eintrag .dateiname { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .eintrag .klein { color: var(--grau); font-size: .73rem; }
  .eintrag .knoepfe { display: flex; gap: .25rem; flex: 0 0 auto; }
  .composer-aktionen { display: flex; gap: .45rem; flex-wrap: wrap; }

  /* ---- Zeitleiste ---- */
  .tagzeile {
    display: flex;
    gap: 1rem;
    padding: 1rem 0;
    border-top: 1px solid var(--rand);
  }
  .tagzeile:first-child { border-top: 0; padding-top: .25rem; }
  .tagzeile.leerlauf .zahl,
  .tagzeile.leerlauf .monat,
  .tagzeile.leerlauf .wer { color: var(--blass); }

  .datumspalte { flex: 0 0 74px; text-align: right; }
  .datumspalte .zahl {
    font-family: var(--serif);
    font-size: 1.7rem;
    line-height: 1.05;
  }
  .datumspalte .monat { font-size: .72rem; color: var(--grau); }
  .datumspalte .heute {
    display: inline-block;
    font-size: .68rem;
    border: 1px solid var(--rand);
    border-radius: 10px;
    padding: 0 .4rem;
    margin-top: .2rem;
    color: var(--grau);
  }

  .tagzeile .inhalt { flex: 1 1 auto; min-width: 0; }
  .tagzeile .wer {
    font-family: var(--serif);
    font-size: 1.05rem;
    margin-bottom: .45rem;
  }
  .tagzeile .wer span { font-family: system-ui, sans-serif; font-size: .75rem; color: var(--grau); }

  .clips { display: flex; gap: .35rem; }
  .kachel {
    flex: 1 1 0;
    max-width: 108px;
    aspect-ratio: 3 / 4;
    background: var(--platz);
    border-radius: 3px;
    overflow: hidden;
    position: relative;
    cursor: pointer;
  }
  .kachel img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .kachel .play {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 1.2rem;
    text-shadow: 0 0 10px rgba(0,0,0,.8);
    pointer-events: none;
  }
  .kachel .wartet {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: .65rem; color: var(--grau); text-align: center; padding: .2rem;
  }

  .keins {
    border: 1px dashed var(--blass);
    border-radius: 3px;
    padding: .8rem;
    font-size: .8rem;
    color: var(--blass);
  }
  .pausenfeld {
    border: 1px dotted var(--blass);
    border-radius: 3px;
    padding: .8rem;
    font-size: .8rem;
    color: var(--grau);
  }

  .extraknopf { margin-top: .55rem; font-size: .78rem; }
  .extras { margin-top: .5rem; }
  .extras .wer { font-size: .8rem; font-family: system-ui, sans-serif; color: var(--grau); }

  /* ---- Wochenraster (Umschaltung) ---- */
  #woche {
    display: grid;
    grid-template-columns: repeat(7, minmax(96px, 1fr));
    gap: .5rem;
    overflow-x: auto;
    padding-bottom: .5rem;
  }
  .tagspalte .tagkopf {
    border-bottom: 1px solid var(--rand);
    padding-bottom: .25rem;
    margin-bottom: .45rem;
    font-size: .75rem;
    display: flex;
    justify-content: space-between;
  }
  .tagspalte.heute .tagkopf { border-bottom-color: var(--text); }
  .tagspalte.zukunft { opacity: .45; }
  .tagspalte .wer {
    font-family: var(--serif);
    font-size: .85rem;
    margin-top: .3rem;
  }
  .tagspalte .kachel { max-width: none; }

  #wochenleiste { display: flex; align-items: center; gap: .4rem; margin-bottom: .8rem; }
  #wochentitel { font-family: var(--serif); font-size: 1.05rem; margin: 0 .4rem; }
  #dran { margin-left: auto; color: var(--grau); font-size: .8rem; }

  /* ---- Belegungsübersicht ---- */
  #uebersicht {
    border-top: 1px solid var(--rand);
    margin-top: 1.75rem;
    padding-top: 1.1rem;
  }
  #zahlen { display: flex; gap: 1.75rem; flex-wrap: wrap; margin-bottom: 1rem; }
  #zahlen .kennzahl .titel { font-size: .7rem; color: var(--grau); }
  #zahlen .kennzahl .wert { font-family: var(--serif); font-size: 1.25rem; }

  #raster { width: 100%; border-collapse: collapse; font-size: .78rem; }
  #raster td { padding: .18rem 0; }
  #raster td.person { color: var(--grau); width: 6.5rem; }
  #raster td.punkt { text-align: center; }
  #raster .da { color: var(--text); }
  #raster .fehlt { color: var(--blass); }
  #raster .legende { font-size: .72rem; color: var(--grau); padding-top: .6rem; }

  /* ---- Overlay ---- */
  #overlay {
    position: fixed; inset: 0;
    background: rgba(20,19,17,.9);
    display: flex; align-items: center; justify-content: center;
    padding: 1rem; z-index: 10;
  }
  #overlay-inhalt {
    background: var(--flaeche);
    border-radius: 4px;
    max-width: 640px; width: 100%; max-height: 100%; overflow: auto;
  }
  #overlay video, #overlay img.voll { width: 100%; display: block; background: #000; }
  #overlay .leiste {
    padding: .55rem .7rem;
    display: flex; gap: .4rem; align-items: center; flex-wrap: wrap;
    font-size: .8rem;
  }
  #overlay .leiste .info { color: var(--grau); margin-right: auto; }
  #overlay .ladeanzeige { padding: 3rem 1rem; text-align: center; color: var(--grau); }
  #overlay .ersatz { padding: 1.5rem; text-align: center; font-size: .85rem; }
  #overlay .ersatz p { color: var(--grau); }

  /* ---- Handy-Vorschau ---- */
  body.handy {
    max-width: 390px;
    border: 1px solid var(--blass);
    border-radius: 22px;
    padding: 1rem .8rem 2rem;
    margin: 1.5rem auto;
  }
  body.handy h1 { font-size: 1.25rem; }
  body.handy .datumspalte { flex: 0 0 52px; }
  body.handy .datumspalte .zahl { font-size: 1.4rem; }

  @media (max-width: 560px) {
    .datumspalte { flex: 0 0 52px; }
    .datumspalte .zahl { font-size: 1.4rem; }
    .tagzeile { gap: .7rem; }
  }

  #aufgeraeumt { font-size: .8rem; color: var(--grau); margin: 0 0 1rem; }
  #konto { font-size: .75rem; color: var(--blass); }
  #konto.falsch { color: #8c2f22; }
  #status { color: var(--grau); }
  #fehler {
    color: #8c2f22;
    white-space: pre-wrap;
    font-size: .82rem;
    border: 1px solid #d8b9b1;
    background: #fbf3f1;
    padding: .7rem;
    border-radius: 3px;
    margin-bottom: 1rem;
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<header>
  <h1>Videotagebuch</h1>
  <button id="anmelden" class="wichtig">Mit Google anmelden</button>
  <button id="ansicht" class="leise" hidden>Wochenraster</button>
  <button id="neuladen" class="leise" hidden>Neu laden</button>
  <button id="wechseln" class="leise" hidden>Konto wechseln</button>
  <button id="handyknopf" class="leise">Handy-Ansicht</button>
  <span id="konto"></span>
</header>

<div id="hochladen-bereich" hidden>
  <label for="person">Ich bin</label>
  <select id="person"></select>
  <label for="fuer">für</label>
  <select id="fuer">
    <option value="0">heute</option>
    <option value="1">gestern</option>
    <option value="2">vorgestern</option>
  </select>
  <button id="waehlen" class="wichtig">Videos auswählen</button>
  <input type="file" id="datei" accept="video/*,image/*" multiple hidden>
  <span id="hochladen-status"></span>
  <div id="balken" hidden><div></div></div>
</div>

<section id="composer" hidden>
  <div>
    <strong id="composer-titel"></strong>
    <span class="hinweis">Reihenfolge festlegen, ansehen, dann abschicken.</span>
  </div>
  <ol id="composer-liste"></ol>
  <div class="composer-aktionen">
    <button id="absenden" class="wichtig">Hochladen</button>
    <button id="vorschau">Vorschau ansehen</button>
    <button id="mehr">Weitere hinzufügen</button>
    <button id="verwerfen" class="leise">Verwerfen</button>
  </div>
</section>

<div id="fehler" hidden></div>
<p id="aufgeraeumt" hidden></p>
<p id="status">Nicht angemeldet.</p>

<nav id="wochenleiste" hidden>
  <button id="zurueck" class="symbol" title="Woche zurück">‹</button>
  <button id="vor" class="symbol" title="Woche vor">›</button>
  <span id="wochentitel"></span>
  <button id="diesewoche" class="leise">Diese Woche</button>
  <span id="dran"></span>
</nav>

<main id="zeitleiste" hidden></main>
<div id="woche" hidden></div>

<section id="uebersicht" hidden>
  <div id="zahlen"></div>
  <table id="raster"></table>
</section>

<div id="overlay" hidden><div id="overlay-inhalt"></div></div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
// ============ EINSTELLUNGEN ============

const CONFIG = {

  CLIENT_ID: '162999381232-kmusrtl8hsnp8ilr8dg71pb7q9udobnm.apps.googleusercontent.com',

  // Der Hauptordner "Videotagebuch"
  ORDNER_ID: '1quX3ETKLsfNxEIsOpiOXHOgrcbtJnsBb',

  AUFBEWAHRUNG_TAGE: 30,

  // Wie lange ein Bild beim Abspielen stehen bleibt.
  BILD_SEKUNDEN: 4,

  // Wie viele Tage die Zeitleiste zeigt.
  ZEITLEISTE_TAGE: 30,

  // Wer wann dran ist.
  //
  // Sieben Namen plus ein Pausentag ergeben einen Zyklus von acht
  // Tagen. Weil eine Woche nur sieben Tage hat, verschiebt sich die
  // Zuteilung jede Woche um einen Tag – sonst hätte jeder für immer
  // denselben Wochentag. Nach acht Wochen war jeder einmal überall.
  //
  // null steht für den Pausentag.
  REIHENFOLGE: [
    'fabian', 'lennart', 'joshua', 'dario', 'benni', 'jarno', 'timo', null
  ],

  // Erster Tag des Zyklus – an diesem Tag ist der erste Name dran.
  ZYKLUS_START: '2026-08-10',

  // Erlaubte Konten. Leer lassen heißt: jeder, der Zugriff auf den
  // geteilten Ordner hat, darf mitmachen – das ist die einfachere
  // Variante, weil die Freigabe in Drive dann die einzige Liste ist,
  // die du pflegen musst.
  KONTEN: [],

  // Räumt beim Öffnen der Seite die eigenen abgelaufenen Videos weg.
  //
  // Löschen darf in Drive nur, wem die Datei gehört. Da jeder mit
  // seinem eigenen Konto hochlädt, kann auch nur sein Browser seine
  // eigenen Videos entfernen – deshalb macht die Seite es und nicht
  // ein zentrales Skript. Fremde Dateien werden nie angefasst.
  AUTO_LOESCHEN: true,

  // Vollzugriff auf Drive. Der eingeschränkte Bereich drive.file
  // dürfte nur Dateien anfassen, die die App selbst angelegt hat –
  // dann sähe niemand die Videos der anderen.
  BEREICH: 'https://www.googleapis.com/auth/drive'
};

const WOCHENTAGE = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];
const MONATE = ['Januar','Februar','März','April','Mai','Juni','Juli',
                'August','September','Oktober','November','Dezember'];


// ============ ZUSTAND ============

let token = null;
let tokenClient = null;
let unterordner = [];
let dateien = [];
let meineMail = '';
let wochenStart = montagVon(new Date());
let ansicht = 'zeitleiste';   // oder 'woche'

const el = {
  anmelden:  document.getElementById('anmelden'),
  konto:     document.getElementById('konto'),
  wechseln:  document.getElementById('wechseln'),
  ansicht:   document.getElementById('ansicht'),
  neuladen:  document.getElementById('neuladen'),
  status:    document.getElementById('status'),
  aufgeraeumt: document.getElementById('aufgeraeumt'),
  fehler:    document.getElementById('fehler'),
  bereich:   document.getElementById('hochladen-bereich'),
  person:    document.getElementById('person'),
  fuer:      document.getElementById('fuer'),
  waehlen:   document.getElementById('waehlen'),
  datei:     document.getElementById('datei'),
  hlStatus:  document.getElementById('hochladen-status'),
  balken:    document.getElementById('balken'),
  composer:  document.getElementById('composer'),
  cTitel:    document.getElementById('composer-titel'),
  cListe:    document.getElementById('composer-liste'),
  leiste:    document.getElementById('wochenleiste'),
  titel:     document.getElementById('wochentitel'),
  dran:      document.getElementById('dran'),
  zeitleiste:document.getElementById('zeitleiste'),
  woche:     document.getElementById('woche'),
  uebersicht:document.getElementById('uebersicht'),
  zahlen:    document.getElementById('zahlen'),
  raster:    document.getElementById('raster'),
  overlay:   document.getElementById('overlay'),
  overlayIn: document.getElementById('overlay-inhalt')
};


// ============ DATUM ============

function montagVon(d) {
  const x = new Date(d);
  x.setDate(x.getDate() - ((x.getDay() + 6) % 7));
  x.setHours(0, 0, 0, 0);
  return x;
}

function schluessel(d) {
  const x = new Date(d);
  return x.getFullYear() + '-'
       + String(x.getMonth() + 1).padStart(2, '0') + '-'
       + String(x.getDate()).padStart(2, '0');
}

function plusTage(d, n) {
  const x = new Date(d);
  x.setDate(x.getDate() + n);
  return x;
}


// ============ WER IST DRAN ============

function werIstDran(tag) {
  const start = new Date(CONFIG.ZYKLUS_START + 'T00:00:00');
  const jetzt = new Date(tag);
  jetzt.setHours(0, 0, 0, 0);

  const laenge = CONFIG.REIHENFOLGE.length;
  const abstand = Math.round((jetzt - start) / 86400000);
  return CONFIG.REIHENFOLGE[((abstand % laenge) + laenge) % laenge];
}

function ordnerFuer(name) {
  if (!name) return null;
  const gesucht = name.toLowerCase();
  return unterordner.find(function (o) {
    return o.name.toLowerCase().indexOf(gesucht) !== -1;
  }) || null;
}

/**
 * Zu welchem Tag gehört eine Datei? Normalerweise der Upload-
 * Zeitpunkt – wer aber nachreicht, lädt mit vorangestelltem Datum
 * hoch, dann zählt das.
 */
function tagAus(datei) {
  const treffer = /^(\d{4}-\d{2}-\d{2})_/.exec(datei.name || '');
  return treffer ? treffer[1] : schluessel(datei.createdTime);
}

/** Alle Clips eines Tages von der Person, die dran war. */
function clipsVon(tagSchluessel, name) {
  const ordner = ordnerFuer(name);
  if (!ordner) return [];
  return dateien
    .filter(function (d) {
      return d.tagSchluessel === tagSchluessel && d.ordner === ordner.name;
    })
    .sort(nachName);
}

/** Alles, was an dem Tag sonst noch hochgeladen wurde. */
function extrasVon(tagSchluessel, name) {
  const ordner = ordnerFuer(name);
  return dateien
    .filter(function (d) {
      return d.tagSchluessel === tagSchluessel
          && (!ordner || d.ordner !== ordner.name);
    })
    .sort(nachName);
}

function nachName(a, b) {
  return a.name < b.name ? -1 : (a.name > b.name ? 1 : 0);
}


// ============ ANMELDUNG ============

/**
 * Der Zugang von Google gilt eine Stunde. Ihn im Tab zu behalten
 * erspart die Anmeldung beim Neuladen der Seite. sessionStorage
 * und nicht localStorage: beim Schließen des Tabs ist er weg.
 */
function merkeZugang(antwort) {
  try {
    sessionStorage.setItem('videotagebuch.zugang', JSON.stringify({
      token: antwort.access_token,
      bis: Date.now() + (Number(antwort.expires_in || 3600) - 120) * 1000
    }));
  } catch (e) {}
}

function gemerkterZugang() {
  try {
    const roh = sessionStorage.getItem('videotagebuch.zugang');
    if (!roh) return null;
    const z = JSON.parse(roh);
    return z.bis > Date.now() ? z.token : null;
  } catch (e) { return null; }
}

/** Zuletzt benutztes Konto – erspart Google die Kontoauswahl. */
function merkeKonto(mail) {
  try { localStorage.setItem('videotagebuch.konto', mail); } catch (e) {}
}
function gemerktesKonto() {
  try { return localStorage.getItem('videotagebuch.konto') || ''; } catch (e) { return ''; }
}

async function angemeldet() {
  el.anmelden.hidden = true;
  el.neuladen.hidden = false;
  el.ansicht.hidden = false;
  el.wechseln.hidden = false;
  if (await zeigeKonto()) laden();
}

/**
 * Wer ist gerade angemeldet? Wird angezeigt und gegen die Liste der
 * Projekt-Konten geprüft.
 */
async function zeigeKonto() {
  try {
    const info = await drive('about', { fields: 'user(emailAddress)' });
    meineMail = (info.user && info.user.emailAddress) || '';
  } catch (e) {
    return true;   // ohne Auskunft lieber weitermachen als blockieren
  }
  if (!meineMail) return true;

  el.konto.textContent = meineMail;

  if (CONFIG.KONTEN.length && CONFIG.KONTEN.indexOf(meineMail) === -1) {
    // Nicht merken – sonst schlägt die Seite beim nächsten Mal
    // wieder dasselbe falsche Konto vor.
    el.konto.classList.add('falsch');
    el.bereich.hidden = true;
    zeigeFehler('Du bist als ' + meineMail + ' angemeldet.\n'
      + 'Dieses Konto gehört nicht zum Projekt.\n\n'
      + 'Bitte oben auf "Konto wechseln" gehen.');
    return false;
  }

  merkeKonto(meineMail);
  el.konto.classList.remove('falsch');
  el.bereich.hidden = false;
  return true;
}

window.onload = function () {
  if (CONFIG.CLIENT_ID.indexOf('apps.googleusercontent.com') === -1) {
    zeigeFehler('Es ist noch keine CLIENT_ID eingetragen. Siehe README.md.');
    el.anmelden.disabled = true;
    return;
  }

  const warten = setInterval(function () {
    if (!window.google || !google.accounts) return;
    clearInterval(warten);

    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: CONFIG.CLIENT_ID,
      scope: CONFIG.BEREICH,
      hint: gemerktesKonto(),
      callback: function (antwort) {
        if (antwort.error) {
          // Bei der stillen Anmeldung ist ein Fehlschlag normal
          if (!leiseAnmeldung) {
            zeigeFehler('Anmeldung fehlgeschlagen: ' + antwort.error);
          }
          leiseAnmeldung = false;
          return;
        }
        leiseAnmeldung = false;
        token = antwort.access_token;
        merkeZugang(antwort);
        angemeldet();
      }
    });

    // Noch gültiger Zugang aus dieser Sitzung? Dann ohne Klick weiter.
    const alt = gemerkterZugang();
    if (alt) {
      token = alt;
      angemeldet();
      return;
    }

    // Sonst still versuchen: Ist der Browser noch bei Google
    // angemeldet und die Zustimmung bereits erteilt, kommt der
    // neue Schlüssel ohne jede Abfrage zurück.
    if (gemerktesKonto()) stillAnmelden();
  }, 100);
};

/**
 * Anmeldung ohne Nachfrage. Klappt das nicht – etwa weil der
 * Browser das Fenster blockiert oder die Google-Sitzung abgelaufen
 * ist – bleibt einfach der Anmeldeknopf stehen. Deshalb wird hier
 * kein Fehler angezeigt.
 */
function stillAnmelden() {
  leiseAnmeldung = true;
  try {
    tokenClient.requestAccessToken({ prompt: '' });
  } catch (e) {
    leiseAnmeldung = false;
  }
  setTimeout(function () { leiseAnmeldung = false; }, 4000);
}

let leiseAnmeldung = false;

el.anmelden.onclick = function () { tokenClient.requestAccessToken(); };

/** Erzwingt Googles Kontoauswahl, statt das letzte Konto zu nehmen. */
el.wechseln.onclick = function () {

  try {
    sessionStorage.removeItem('videotagebuch.zugang');
    localStorage.removeItem('videotagebuch.konto');

  el.fehler.hidden = true;
  tokenClient.requestAccessToken({ prompt: 'select_account' });
};

// ============ DRIVE LESEN ============

async function drive(pfad, params) {
  const url = new URL('https://www.googleapis.com/drive/v3/' + pfad);
  Object.keys(params || {}).forEach(function (k) {
    url.searchParams.set(k, params[k]);
  });

  const antwort = await fetch(url, { headers: { Authorization: 'Bearer ' + token } });

  if (antwort.status === 401) {
    // Schlüssel abgelaufen – still einen neuen holen. Ist der
    // Browser noch bei Google angemeldet, merkt der Nutzer nichts.
    token = null;
    try { sessionStorage.removeItem('videotagebuch.zugang'); } catch (e) {}
    stillAnmelden();
    throw new Error('Der Zugang ist abgelaufen. Wird erneuert – '
                  + 'falls nichts passiert, bitte noch einmal anmelden.');
  }
  if (!antwort.ok) {
    throw new Error('Drive antwortete mit ' + antwort.status + ':\n' + (await antwort.text()));
  }
  return antwort.json();
}

async function ordnerHolen() {
  const antwort = await drive('files', {
    q: "'" + CONFIG.ORDNER_ID + "' in parents"
       + " and mimeType='application/vnd.google-apps.folder' and trashed=false",
    fields: 'files(id,name)',
    orderBy: 'name',
    pageSize: 100
  });
  return antwort.files;
}

async function dateienHolen() {
  const quellen = [{ id: CONFIG.ORDNER_ID, name: '(Hauptordner)' }].concat(unterordner);
  const ergebnis = [];

  for (const ordner of quellen) {
    const inhalt = await drive('files', {
      q: "'" + ordner.id + "' in parents"
         + " and mimeType!='application/vnd.google-apps.folder' and trashed=false",
      fields: 'files(id,name,mimeType,createdTime,size,thumbnailLink,'
            + 'owners(emailAddress),capabilities(canDelete))',
      orderBy: 'createdTime desc',
      pageSize: 200
    });
    inhalt.files.forEach(function (datei) {
      datei.ordner = ordner.name;
      datei.tagSchluessel = tagAus(datei);
      ergebnis.push(datei);
    });
  }
  return ergebnis;
}

async function laden() {
  el.fehler.hidden = true;
  el.status.hidden = false;
  el.status.textContent = 'Lade …';

  try {
    unterordner = await ordnerHolen();
    fuellePersonen();
    dateien = await dateienHolen();

    if (CONFIG.AUTO_LOESCHEN) await aufraeumen();

    el.status.hidden = true;
    zeichne();
  } catch (fehler) {
    el.status.hidden = true;
    zeigeFehler(fehler.message);
  }
}


// ============ AUFRÄUMEN ============

/**
 * Entfernt die eigenen abgelaufenen Videos endgültig.
 *
 * Vier Bedingungen müssen zusammenkommen, sonst passiert nichts:
 *   – die Datei gehört dem angemeldeten Konto
 *   – Drive bestätigt selbst, dass gelöscht werden darf
 *   – sie liegt im Projektordner (etwas anderes lädt die Seite nie)
 *   – sie ist älter als die Aufbewahrungszeit
 *
 * Maßgeblich ist der echte Upload-Zeitpunkt, nicht das Datum im
 * Dateinamen. Ein nachgereichtes Video verschwindet dadurch nicht
 * sofort, nur weil es einen älteren Tag beschreibt.
 *
 * Endgültig statt Papierkorb: Der Papierkorb belegt weiter Speicher.
 */
async function aufraeumen() {
  const grenze = Date.now() - CONFIG.AUFBEWAHRUNG_TAGE * 86400000;

  const abgelaufen = dateien.filter(function (d) {
    const meins = d.owners
      && d.owners.some(function (o) { return o.emailAddress === meineMail; });
    const darf = !d.capabilities || d.capabilities.canDelete !== false;
    return meins && darf && new Date(d.createdTime).getTime() < grenze;
  });

  if (!abgelaufen.length) return;

  el.status.hidden = false;
  el.status.textContent = 'Räume ' + abgelaufen.length + ' abgelaufene auf …';

  const geloescht = [];

  for (const datei of abgelaufen) {
    try {
      const antwort = await fetch(
        'https://www.googleapis.com/drive/v3/files/' + datei.id,
        { method: 'DELETE', headers: { Authorization: 'Bearer ' + token } }
      );
      if (antwort.ok || antwort.status === 404) geloescht.push(datei.id);
    } catch (e) { /* beim nächsten Öffnen erneut versuchen */ }
  }

  if (geloescht.length) {
    dateien = dateien.filter(function (d) {
      return geloescht.indexOf(d.id) === -1;
    });
    el.aufgeraeumt.textContent = geloescht.length === 1
      ? 'Ein abgelaufenes Video wurde gelöscht.'
      : geloescht.length + ' abgelaufene Videos wurden gelöscht.';
    el.aufgeraeumt.hidden = false;
  }
}


// ============ ZEICHNEN ============

function istSchmal() {
  return document.body.classList.contains('handy') || window.innerWidth < 700;
}

function zeichne() {
  // Auf schmalen Bildschirmen gibt es kein Wochenraster – sieben
  // Spalten nebeneinander funktionieren auf einem Telefon nicht.
  const wochenAnsicht = ansicht === 'woche' && !istSchmal();

  el.ansicht.textContent = wochenAnsicht ? 'Zeitleiste' : 'Wochenraster';
  el.ansicht.hidden = istSchmal();

  el.leiste.hidden      = !wochenAnsicht;
  el.woche.hidden       = !wochenAnsicht;
  el.zeitleiste.hidden  = wochenAnsicht;

  if (wochenAnsicht) zeichneWoche(); else zeichneZeitleiste();
  zeichneUebersicht();
}

let umschaltTimer = null;
window.addEventListener('resize', function () {
  clearTimeout(umschaltTimer);
  if (token) umschaltTimer = setTimeout(zeichne, 150);
});


// ============ ZEITLEISTE ============

function zeichneZeitleiste() {
  el.zeitleiste.innerHTML = '';
  const heute = schluessel(new Date());

  for (let i = 0; i < CONFIG.ZEITLEISTE_TAGE; i++) {
    el.zeitleiste.appendChild(tagZeile(plusTage(new Date(), -i), heute));
  }
}

function tagZeile(tag, heuteSchluessel) {
  const s = schluessel(tag);
  const dran = werIstDran(tag);
  const zeile = document.createElement('article');
  zeile.className = 'tagzeile';

  // ---- Datumsspalte ----
  const datum = document.createElement('div');
  datum.className = 'datumspalte';
  datum.innerHTML =
      '<div class="zahl">' + tag.getDate() + '</div>'
    + '<div class="monat">' + WOCHENTAGE[(tag.getDay() + 6) % 7]
    + ' ' + MONATE[tag.getMonth()].slice(0, 3) + '</div>'
    + (s === heuteSchluessel ? '<div class="heute">heute</div>' : '');
  zeile.appendChild(datum);

  // ---- Inhalt ----
  const inhalt = document.createElement('div');
  inhalt.className = 'inhalt';

  if (dran === null) {
    zeile.classList.add('leerlauf');
    inhalt.innerHTML = '<div class="wer">Pausentag</div>'
                     + '<div class="pausenfeld">niemand dran</div>';
    zeile.appendChild(inhalt);
    ergaenzeExtras(inhalt, s, dran);
    return zeile;
  }

  const clips = clipsVon(s, dran);

  const wer = document.createElement('div');
  wer.className = 'wer';
  wer.innerHTML = escape_(dran)
    + (clips.length > 1 ? ' <span>' + clips.length + ' Clips</span>' : '');
  inhalt.appendChild(wer);

  if (clips.length) {
    inhalt.appendChild(kachelReihe(clips));
  } else {
    zeile.classList.add('leerlauf');
    const leer = document.createElement('div');
    leer.className = 'keins';
    leer.textContent = ordnerFuer(dran)
      ? (tag > new Date() ? 'steht noch aus' : 'kein Video')
      : 'noch kein Ordner angelegt';
    inhalt.appendChild(leer);
  }

  zeile.appendChild(inhalt);
  ergaenzeExtras(inhalt, s, dran);
  return zeile;
}

function kachelReihe(clips) {
  const reihe = document.createElement('div');
  reihe.className = 'clips';
  clips.forEach(function (datei, i) {
    reihe.appendChild(kachel(datei, clips, i));
  });
  return reihe;
}

function kachel(datei, gruppe, index) {
  const k = document.createElement('div');
  k.className = 'kachel';

  if (datei.thumbnailLink) {
    const img = document.createElement('img');
    img.src = datei.thumbnailLink.replace(/=s\d+$/, '=s400');
    img.referrerPolicy = 'no-referrer';
    img.alt = '';
    k.appendChild(img);
  } else {
    const wartet = document.createElement('div');
    wartet.className = 'wartet';
    wartet.textContent = 'wird verarbeitet';
    k.appendChild(wartet);
  }

  if (datei.mimeType.indexOf('video/') === 0) {
    const play = document.createElement('div');
    play.className = 'play';
    play.textContent = '▶';
    k.appendChild(play);
  }

  k.onclick = function () { oeffneOverlay(gruppe, index); };
  return k;
}

/**
 * Videos, die nicht von der Person kommen, die dran war, tauchen
 * nicht von allein auf – sonst wird die Zeitleiste unruhig. Sie
 * lassen sich pro Tag über einen Knopf einblenden.
 */
function ergaenzeExtras(inhalt, tagSchluessel, dran) {
  const extras = extrasVon(tagSchluessel, dran);
  if (!extras.length) return;

  const knopf = document.createElement('button');
  knopf.className = 'extraknopf leise';
  knopf.textContent = '+ ' + extras.length
    + (extras.length === 1 ? ' Video außer der Reihe' : ' Videos außer der Reihe');

  const kasten = document.createElement('div');
  kasten.className = 'extras';
  kasten.hidden = true;

  const namen = Array.from(new Set(extras.map(function (d) { return d.ordner; })));
  const wer = document.createElement('div');
  wer.className = 'wer';
  wer.textContent = namen.join(', ');
  kasten.appendChild(wer);
  kasten.appendChild(kachelReihe(extras));

  knopf.onclick = function () {
    kasten.hidden = !kasten.hidden;
    knopf.textContent = (kasten.hidden ? '+ ' : '– ') + extras.length
      + (extras.length === 1 ? ' Video außer der Reihe' : ' Videos außer der Reihe');
  };

  inhalt.appendChild(knopf);
  inhalt.appendChild(kasten);
}


// ============ WOCHENRASTER ============

document.getElementById('zurueck').onclick = function () {
  wochenStart = plusTage(wochenStart, -7); zeichne();
};
document.getElementById('vor').onclick = function () {
  wochenStart = plusTage(wochenStart, 7); zeichne();
};
document.getElementById('diesewoche').onclick = function () {
  wochenStart = montagVon(new Date()); zeichne();
};

function zeichneWoche() {
  const ende = plusTage(wochenStart, 6);
  el.titel.textContent = titelText(wochenStart, ende);

  const dran = werIstDran(new Date());
  el.dran.textContent = dran === null ? 'heute Pausentag' : 'heute: ' + dran;

  el.woche.innerHTML = '';
  const heute = schluessel(new Date());
  for (let i = 0; i < 7; i++) {
    el.woche.appendChild(tagSpalte(plusTage(wochenStart, i), heute));
  }
}

function titelText(von, bis) {
  if (von.getMonth() === bis.getMonth()) {
    return von.getDate() + '.–' + bis.getDate() + '. '
         + MONATE[von.getMonth()] + ' ' + von.getFullYear();
  }
  return von.getDate() + '. ' + MONATE[von.getMonth()] + ' – '
       + bis.getDate() + '. ' + MONATE[bis.getMonth()] + ' ' + bis.getFullYear();
}

function tagSpalte(tag, heuteSchluessel) {
  const s = schluessel(tag);
  const spalte = document.createElement('div');
  spalte.className = 'tagspalte';
  if (s === heuteSchluessel) spalte.classList.add('heute');
  if (tag.getTime() > Date.now()) spalte.classList.add('zukunft');

  spalte.innerHTML =
      '<div class="tagkopf"><span>' + WOCHENTAGE[(tag.getDay() + 6) % 7]
    + '</span><span>' + tag.getDate() + '.' + (tag.getMonth() + 1) + '.</span></div>';

  const dran = werIstDran(tag);

  if (dran === null) {
    spalte.innerHTML += '<div class="pausenfeld">Pause</div>';
    return spalte;
  }

  const clips = clipsVon(s, dran);

  if (clips.length) {
    spalte.appendChild(kachel(clips[0], clips, 0));
    if (clips.length > 1) {
      const zaehler = document.createElement('div');
      zaehler.className = 'wer';
      zaehler.innerHTML = escape_(dran) + ' <span style="color:var(--grau);font-size:.72rem">'
                        + clips.length + '</span>';
      spalte.appendChild(zaehler);
      return spalte;
    }
  } else {
    const leer = document.createElement('div');
    leer.className = 'keins';
    leer.style.aspectRatio = '3 / 4';
    leer.textContent = '';
    spalte.appendChild(leer);
  }

  const wer = document.createElement('div');
  wer.className = 'wer';
  wer.textContent = dran;
  if (!clips.length) wer.style.color = 'var(--blass)';
  spalte.appendChild(wer);

  return spalte;
}


// ============ BELEGUNGSÜBERSICHT ============

function zeichneUebersicht() {
  el.uebersicht.hidden = false;

  // ---- Kennzahlen ----
  let faellig = 0, geliefert = 0, bytes = 0;

  for (let i = 1; i <= CONFIG.AUFBEWAHRUNG_TAGE; i++) {
    const tag = plusTage(new Date(), -i);
    const dran = werIstDran(tag);
    if (dran === null) continue;
    faellig++;
    if (clipsVon(schluessel(tag), dran).length) geliefert++;
  }

  dateien.forEach(function (d) { bytes += Number(d.size) || 0; });

  // Serie: wie viele fällige Tage am Stück zuletzt geliefert wurden
  let serie = 0;
  for (let i = 1; i <= CONFIG.AUFBEWAHRUNG_TAGE; i++) {
    const tag = plusTage(new Date(), -i);
    const dran = werIstDran(tag);
    if (dran === null) continue;
    if (clipsVon(schluessel(tag), dran).length) serie++;
    else break;
  }

  el.zahlen.innerHTML =
      kennzahl('letzte 30 Tage', geliefert + ' von ' + faellig)
    + kennzahl('Serie', serie + (serie === 1 ? ' Tag' : ' Tage'))
    + kennzahl('Speicher', (bytes / 1073741824).toFixed(1).replace('.', ',') + ' GB');

  // ---- Punkteraster: die letzten Einsätze jeder Person ----
  el.raster.innerHTML = '';

  CONFIG.REIHENFOLGE.forEach(function (name) {
    if (!name) return;

    const eintraege = [];
    for (let i = 1; i <= CONFIG.AUFBEWAHRUNG_TAGE && eintraege.length < 7; i++) {
      const tag = plusTage(new Date(), -i);
      if (werIstDran(tag) !== name) continue;
      eintraege.unshift(clipsVon(schluessel(tag), name).length > 0);
    }

    const zeile = document.createElement('tr');
    zeile.innerHTML = '<td class="person">' + escape_(name) + '</td>'
      + eintraege.map(function (da) {
          return '<td class="punkt ' + (da ? 'da' : 'fehlt') + '">'
               + (da ? '●' : '○') + '</td>';
        }).join('')
      + '<td></td>'.repeat(Math.max(0, 7 - eintraege.length));
    el.raster.appendChild(zeile);
  });

  const legende = document.createElement('tr');
  legende.innerHTML = '<td class="legende" colspan="8">'
    + 'Die letzten sieben eigenen Termine, ältester links. '
    + '● geliefert, ○ ausgelassen.</td>';
  el.raster.appendChild(legende);
}

function kennzahl(titel, wert) {
  return '<div class="kennzahl"><div class="titel">' + titel
       + '</div><div class="wert">' + wert + '</div></div>';
}


// ============ ABSPIELEN ============

let wiedergabe = { liste: [], index: 0 };
let bildTimer = null;

el.overlay.onclick = function (e) {
  if (e.target === el.overlay) schliesseOverlay();
};
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') schliesseOverlay();
});

function schliesseOverlay() {
  clearTimeout(bildTimer);
  el.overlay.hidden = true;
  el.overlayIn.innerHTML = '';
}

function oeffneOverlay(eingabe, start) {
  wiedergabe.liste = Array.isArray(eingabe) ? eingabe : [eingabe];
  wiedergabe.index = start || 0;
  el.overlay.hidden = false;
  zeigeClip();
}

function naechsterClip() {
  if (wiedergabe.index + 1 >= wiedergabe.liste.length) return;
  wiedergabe.index++;
  zeigeClip();
}

function vorherigerClip() {
  if (wiedergabe.index === 0) return;
  wiedergabe.index--;
  zeigeClip();
}

async function zeigeClip() {
  clearTimeout(bildTimer);
  const datei = wiedergabe.liste[wiedergabe.index];
  if (!datei) return;

  el.overlayIn.innerHTML = '<div class="ladeanzeige">lädt …</div>';
  const ladeanzeige = el.overlayIn.firstElementChild;

  try {
    const url = await blobUrl(datei, function (p) {
      ladeanzeige.textContent = 'lädt … ' + p + ' %';
    });

    if (wiedergabe.liste[wiedergabe.index] !== datei) return;
    el.overlayIn.innerHTML = '';

    let anzeige;
    if (datei.mimeType.indexOf('video/') === 0) {
      anzeige = document.createElement('video');
      anzeige.controls = true;
      anzeige.autoplay = true;
      anzeige.playsInline = true;
      anzeige.onended = naechsterClip;
      // Kann der Browser das Format nicht (typisch: HEVC vom iPhone
      // auf einem Android-Gerät), übernimmt Drives eigener Player.
      anzeige.onerror = function () { ersatzPlayer(datei, anzeige); };
    } else {
      anzeige = document.createElement('img');
      anzeige.className = 'voll';
      if (wiedergabe.liste.length > 1) {
        bildTimer = setTimeout(naechsterClip, CONFIG.BILD_SEKUNDEN * 1000);
      }
    }
    anzeige.src = url;
    el.overlayIn.appendChild(anzeige);
    el.overlayIn.appendChild(spielLeiste(datei, url));

    vorladen();

  } catch (fehler) {
    el.overlayIn.innerHTML = '<div class="ersatz"><p>'
      + escape_(fehler.message) + '</p></div>';
  }
}

function vorladen() {
  const naechste = wiedergabe.liste[wiedergabe.index + 1];
  if (naechste && !naechste._url) blobUrl(naechste).catch(function () {});
}

function spielLeiste(datei, url) {
  const l = document.createElement('div');
  l.className = 'leiste';

  const gesamt = wiedergabe.liste.length;
  const zaehler = gesamt > 1
    ? 'Clip ' + (wiedergabe.index + 1) + ' von ' + gesamt + ' · ' : '';

  const info = document.createElement('span');
  info.className = 'info';
  info.textContent = datei.vorschau
    ? zaehler + datei.name + ' · ' + mb(datei.size) + ' MB · noch nicht hochgeladen'
    : zaehler + datei.ordner + ' · ' + mb(datei.size)
      + ' MB · noch ' + tageBisLoeschung(datei.createdTime) + ' Tage';
  l.appendChild(info);

  if (gesamt > 1) {
    const zurueck = document.createElement('button');
    zurueck.className = 'symbol';
    zurueck.textContent = '‹';
    zurueck.title = 'vorheriger Clip';
    zurueck.disabled = wiedergabe.index === 0;
    zurueck.onclick = vorherigerClip;
    l.appendChild(zurueck);

    const weiter = document.createElement('button');
    weiter.className = 'symbol';
    weiter.textContent = '›';
    weiter.title = 'nächster Clip';
    weiter.disabled = wiedergabe.index + 1 >= gesamt;
    weiter.onclick = naechsterClip;
    l.appendChild(weiter);
  }

  if (!datei.vorschau) {
    const laden = document.createElement('button');
    laden.className = 'leise';
    laden.textContent = 'Herunterladen';
    laden.onclick = function () {
      const a = document.createElement('a');
      a.href = url;
      a.download = datei.name;
      a.click();
    };
    l.appendChild(laden);
  }

  const zu = document.createElement('button');
  zu.textContent = 'Schließen';
  zu.onclick = schliesseOverlay;
  l.appendChild(zu);

  return l;
}

function ersatzPlayer(datei, videoElement) {
  const kasten = document.createElement('div');
  kasten.className = 'ersatz';
  kasten.innerHTML = '<p>Dieser Browser kann das Format nicht abspielen.<br>'
                   + 'Meist ein iPhone-Video (HEVC) auf einem Android-Gerät.</p>';

  const knopf = document.createElement('button');
  knopf.textContent = 'Im Drive-Player öffnen';
  knopf.onclick = function () {
    window.open('https://drive.google.com/file/d/' + datei.id + '/view',
                '_blank', 'noopener');
  };
  kasten.appendChild(knopf);
  videoElement.replaceWith(kasten);
}

function tageBisLoeschung(erstellt) {
  const weg = new Date(erstellt).getTime() + CONFIG.AUFBEWAHRUNG_TAGE * 86400000;
  return Math.max(0, Math.ceil((weg - Date.now()) / 86400000));
}

async function blobUrl(datei, fortschritt) {
  if (datei._url) return datei._url;

  const antwort = await fetch(
    'https://www.googleapis.com/drive/v3/files/' + datei.id + '?alt=media',
    { headers: { Authorization: 'Bearer ' + token } }
  );
  if (!antwort.ok) throw new Error('Konnte Datei nicht laden (' + antwort.status + ')');

  const gesamt = Number(datei.size || 0);
  const leser = antwort.body.getReader();
  const teile = [];
  let geladen = 0;

  while (true) {
    const stueck = await leser.read();
    if (stueck.done) break;
    teile.push(stueck.value);
    geladen += stueck.value.length;
    if (gesamt && fortschritt) fortschritt(Math.round(geladen / gesamt * 100));
  }

  datei._url = URL.createObjectURL(new Blob(teile, { type: datei.mimeType }));
  return datei._url;
}


// ============ ZUSAMMENSTELLEN UND HOCHLADEN ============

let entwurf = [];

el.waehlen.onclick = function () { el.datei.click(); };

el.datei.onchange = function () {
  Array.prototype.slice.call(el.datei.files).forEach(function (datei) {
    entwurf.push({
      datei: datei,
      url: URL.createObjectURL(datei),
      name: datei.name,
      mimeType: datei.type || 'application/octet-stream',
      size: datei.size
    });
  });
  el.datei.value = '';
  zeichneEntwurf();
};

function zeichneEntwurf() {
  el.composer.hidden = entwurf.length === 0;
  if (!entwurf.length) return;

  el.cTitel.textContent = entwurf.length
    + (entwurf.length === 1 ? ' Datei bereit' : ' Dateien bereit');

  el.cListe.innerHTML = '';

  entwurf.forEach(function (eintrag, i) {
    const li = document.createElement('li');
    li.className = 'eintrag';

    const nr = document.createElement('span');
    nr.className = 'nr';
    nr.textContent = (i + 1) + '.';
    li.appendChild(nr);

    const mini = document.createElement('div');
    mini.className = 'mini';
    if (eintrag.mimeType.indexOf('video/') === 0) {
      // Ein stummes Video zeigt seinen ersten Frame – billiger,
      // als selbst ein Standbild zu berechnen.
      const v = document.createElement('video');
      v.src = eintrag.url + '#t=0.1';
      v.muted = true;
      v.playsInline = true;
      v.preload = 'metadata';
      mini.appendChild(v);
    } else {
      const img = document.createElement('img');
      img.src = eintrag.url;
      img.alt = '';
      mini.appendChild(img);
    }
    li.appendChild(mini);

    const text = document.createElement('div');
    text.className = 'beschriftung';
    text.innerHTML = '<div class="dateiname">' + escape_(eintrag.name) + '</div>'
      + '<div class="klein">' + mb(eintrag.size) + ' MB · '
      + (eintrag.mimeType.indexOf('video/') === 0
          ? 'Video' : 'Bild, ' + CONFIG.BILD_SEKUNDEN + ' Sek.')
      + '</div>';
    li.appendChild(text);

    const knoepfe = document.createElement('div');
    knoepfe.className = 'knoepfe';

    const hoch = document.createElement('button');
    hoch.className = 'symbol';
    hoch.textContent = '↑';
    hoch.title = 'nach vorne';
    hoch.disabled = i === 0;
    hoch.onclick = function () { tausche(i, i - 1); };
    knoepfe.appendChild(hoch);

    const runter = document.createElement('button');
    runter.className = 'symbol';
    runter.textContent = '↓';
    runter.title = 'nach hinten';
    runter.disabled = i === entwurf.length - 1;
    runter.onclick = function () { tausche(i, i + 1); };
    knoepfe.appendChild(runter);

    const weg = document.createElement('button');
    weg.className = 'symbol leise';
    weg.textContent = '✕';
    weg.title = 'entfernen';
    weg.onclick = function () { entferne(i); };
    knoepfe.appendChild(weg);

    li.appendChild(knoepfe);
    el.cListe.appendChild(li);
  });
}

function tausche(a, b) {
  const merk = entwurf[a];
  entwurf[a] = entwurf[b];
  entwurf[b] = merk;
  zeichneEntwurf();
}

function entferne(i) {
  URL.revokeObjectURL(entwurf[i].url);
  entwurf.splice(i, 1);
  zeichneEntwurf();
}

function leereEntwurf() {
  entwurf.forEach(function (e) { URL.revokeObjectURL(e.url); });
  entwurf = [];
  zeichneEntwurf();
}

document.getElementById('mehr').onclick = function () { el.datei.click(); };
document.getElementById('verwerfen').onclick = leereEntwurf;

document.getElementById('vorschau').onclick = function () {
  if (!entwurf.length) return;
  oeffneOverlay(entwurf.map(function (e) {
    return {
      name: e.name, mimeType: e.mimeType, size: e.size,
      ordner: 'Vorschau', createdTime: new Date().toISOString(),
      vorschau: true,
      _url: e.url          // schon vorhanden, es wird nichts nachgeladen
    };
  }), 0);
};

document.getElementById('absenden').onclick = async function () {
  if (!entwurf.length) return;

  const ordnerId = el.person.value;
  if (!ordnerId) {
    zeigeFehler('Bitte zuerst auswählen, wer du bist.');
    return;
  }

  el.fehler.hidden = true;
  el.waehlen.disabled = true;
  el.balken.hidden = false;
  setzeBalken(0);

  const fuerTag = plusTage(new Date(), -Number(el.fuer.value || 0));

  try {
    // Nacheinander, nicht gleichzeitig – sonst konkurrieren die
    // Uploads um dieselbe Leitung und alle werden langsamer.
    for (let i = 0; i < entwurf.length; i++) {
      const nummer = entwurf.length > 1
        ? ' (' + (i + 1) + ' von ' + entwurf.length + ')' : '';

      await hochladen(entwurf[i].datei, ordnerId, function (prozent) {
        setzeBalken(prozent);
        el.hlStatus.textContent = 'lädt hoch' + nummer + ' … ' + prozent + ' %';
      }, fuerTag, i);
    }
    el.hlStatus.textContent = 'fertig';
    leereEntwurf();
    wochenStart = montagVon(new Date());
    await laden();
  } catch (fehler) {
    el.hlStatus.textContent = '';
    zeigeFehler(fehler.message);
  } finally {
    el.waehlen.disabled = false;
    el.balken.hidden = true;
    el.fuer.value = '0';
    merkePerson();
  }
};

function setzeBalken(p) { el.balken.firstElementChild.style.width = p + '%'; }

function uhrzeitMarke(lfdNr) {
  const d = new Date();
  return String(d.getHours()).padStart(2, '0')
       + String(d.getMinutes()).padStart(2, '0')
       + String(d.getSeconds()).padStart(2, '0')
       + String(lfdNr || 0).padStart(2, '0');
}

/**
 * Wiederaufnehmbarer Upload: erst eine Upload-Adresse anfordern,
 * dann geht die Datei direkt vom Browser zu Google. XMLHttpRequest
 * statt fetch, weil nur das einen Fortschritt meldet.
 */
async function hochladen(datei, ordnerId, fortschritt, fuerTag, lfdNr) {
  // Datum vorn für die Zuordnung zum Tag, danach eine Uhrzeit,
  // damit mehrere Clips in ihrer Reihenfolge bleiben.
  const name = schluessel(fuerTag || new Date()) + '_'
             + uhrzeitMarke(lfdNr) + '_' + datei.name;

  const start = await fetch(
    'https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable',
    {
      method: 'POST',
      headers: {
        Authorization: 'Bearer ' + token,
        'Content-Type': 'application/json; charset=UTF-8',
        'X-Upload-Content-Type': datei.type || 'application/octet-stream',
        'X-Upload-Content-Length': datei.size
      },
      body: JSON.stringify({ name: name, parents: [ordnerId] })
    }
  );

  if (!start.ok) {
    throw new Error('Upload konnte nicht gestartet werden ('
                    + start.status + '):\n' + (await start.text()));
  }

  const sitzung = start.headers.get('Location');
  if (!sitzung) throw new Error('Google hat keine Upload-Adresse zurückgegeben.');

  return new Promise(function (fertig, fehlgeschlagen) {
    const xhr = new XMLHttpRequest();
    xhr.open('PUT', sitzung);
    xhr.setRequestHeader('Content-Type', datei.type || 'application/octet-stream');

    xhr.upload.onprogress = function (e) {
      if (e.lengthComputable) fortschritt(Math.round(e.loaded / e.total * 100));
    };
    xhr.onload = function () {
      if (xhr.status >= 200 && xhr.status < 300) fertig(JSON.parse(xhr.responseText || '{}'));
      else fehlgeschlagen(new Error('Upload fehlgeschlagen ('
                          + xhr.status + '):\n' + xhr.responseText));
    };
    xhr.onerror = function () {
      fehlgeschlagen(new Error('Netzwerkfehler beim Hochladen.'));
    };
    xhr.send(datei);
  });
}

function fuellePersonen() {
  const vorher = el.person.value || gemerktePerson();
  el.person.innerHTML = '';

  if (!unterordner.length) {
    const leer = document.createElement('option');
    leer.textContent = '(kein Unterordner gefunden)';
    leer.value = '';
    el.person.appendChild(leer);
    return;
  }

  unterordner.forEach(function (o) {
    const option = document.createElement('option');
    option.value = o.id;
    option.textContent = o.name;
    el.person.appendChild(option);
  });

  if (vorher) el.person.value = vorher;
}

el.person.onchange = merkePerson;

function merkePerson() {
  try { localStorage.setItem('videotagebuch.person', el.person.value); } catch (e) {}
}
function gemerktePerson() {
  try { return localStorage.getItem('videotagebuch.person'); } catch (e) { return null; }
}


// ============ KLEINKRAM ============

function mb(bytes) { return Math.round((Number(bytes) || 0) / 1048576); }

function escape_(text) {
  const d = document.createElement('div');
  d.textContent = text;
  return d.innerHTML;
}

function zeigeFehler(text) {
  el.fehler.textContent = text;
  el.fehler.hidden = false;
}
